<!-- Garment Manufacturing ERP — single-file app. Workflow: Buyer PO -> BOM -> Raw Material Import -> Production -> Export. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seam — Garment Manufacturing ERP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}</script>
<!-- Shared database (optional). firebase-config.js fills window.FIREBASE_CONFIG when hosted. -->
<script>window.FIREBASE_CONFIG = null;</script>
<script src="firebase-config.js" onerror="void 0"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#EAEEF2; --surface:#FFFFFF; --surface-2:#F5F7FA;
    --ink:#15213B; --ink-soft:#5C6779; --ink-faint:#8A93A3;
    --line:#DCE2EA; --line-soft:#E9EDF2;
    --denim:#2B4A7E; --denim-dark:#1E355C; --denim-deep:#16243F;
    --chalk:#1F8C7E;        /* teal — done / received */
    --thread:#C9781F;       /* amber — pending / attention */
    --red:#BC4338; --amber:#B5811C; --green:#2A8A56; --blue:#2B6CB0;
    --shadow:0 1px 2px rgba(21,33,59,.06), 0 6px 20px rgba(21,33,59,.05);
    --radius:10px;
    --mono:"SFMono-Regular",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  body{display:grid; grid-template-columns:236px 1fr; grid-template-rows:100vh}

  /* ---------- Sidebar ---------- */
  .side{
    background:linear-gradient(180deg,var(--denim-deep),#101b30);
    color:#C7D0DE; display:flex; flex-direction:column; overflow:hidden;
    border-right:1px solid #0c1426;
  }
  .brand{padding:20px 20px 16px; border-bottom:1px solid rgba(255,255,255,.07)}
  .brand .mark{display:flex; align-items:center; gap:10px}
  .brand .stitch{width:26px;height:26px;border:2px dashed #6E89BE;border-radius:6px;display:grid;place-items:center;color:#9FB6E0;font-weight:800;font-size:13px}
  .brand h1{font-size:16px; letter-spacing:.08em; margin:0; color:#fff; font-weight:700; text-transform:uppercase}
  .brand .sub{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:#7E8DA8; margin-top:3px}
  nav{padding:10px 12px; overflow:auto; flex:1}
  .nav-group{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#647295; margin:16px 10px 6px}
  .nav-item{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; cursor:pointer; color:#BCC6D6; font-weight:500; font-size:13.5px; user-select:none}
  .nav-item .ico{width:18px; text-align:center; opacity:.85; font-size:15px}
  .nav-item .badge{margin-left:auto; background:rgba(255,255,255,.08); color:#cdd6e4; font-size:11px; padding:1px 7px; border-radius:20px; font-variant-numeric:tabular-nums}
  .nav-item:hover{background:rgba(255,255,255,.05); color:#fff}
  .nav-item.active{background:var(--denim); color:#fff; box-shadow:inset 2px 0 0 #9FB6E0}
  .nav-item.active .badge{background:rgba(255,255,255,.18)}
  .side-foot{padding:12px 14px; border-top:1px solid rgba(255,255,255,.07); font-size:11px; color:#647295}
  .side-foot button{background:none;border:1px solid rgba(255,255,255,.14);color:#aebbcf;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:11.5px;width:100%;font-family:inherit}
  .side-foot button:hover{border-color:#6E89BE;color:#fff}

  /* ---------- Main ---------- */
  .main{overflow:auto; display:flex; flex-direction:column}
  .topbar{
    position:sticky; top:0; z-index:5; background:rgba(234,238,242,.85); backdrop-filter:blur(8px);
    padding:18px 28px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:flex-end; gap:16px;
  }
  .topbar .eyebrow{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint); font-weight:600}
  .topbar h2{margin:2px 0 0; font-size:22px; font-weight:700; letter-spacing:-.01em}
  .topbar .seam{height:6px;margin-top:9px;border-bottom:2px dashed var(--line);}
  .topbar .right{margin-left:auto; display:flex; gap:9px; align-items:center}
  .content{padding:22px 28px 60px; max-width:1280px; width:100%}

  /* ---------- Mobile top bar + drawer (hidden on desktop) ---------- */
  .mobilebar{display:none; align-items:center; gap:12px; padding:10px 14px;
    background:linear-gradient(180deg,var(--denim-deep),#101b30); color:#fff;
    position:sticky; top:0; z-index:40}
  .mobilebar .hamburger{background:none; border:1px solid rgba(255,255,255,.22); color:#fff;
    width:40px; height:38px; border-radius:9px; font-size:19px; cursor:pointer; line-height:1; font-family:inherit}
  .mobilebar .hamburger:active{background:rgba(255,255,255,.12)}
  .mobilebar .mbrand{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:15px}
  .mobilebar .mbrand .stitch{width:24px;height:24px;border:2px dashed #6E89BE;border-radius:6px;display:grid;place-items:center;color:#9FB6E0;font-weight:800;font-size:12px}
  .navscrim{display:none; position:fixed; inset:0; background:rgba(10,18,35,.5); z-index:55; opacity:0; transition:opacity .2s}
  body.nav-open .navscrim{opacity:1}

  /* ---------- Trade-mark footer (RMW) ---------- */
  .appfoot{margin-top:auto; text-align:center; padding:16px 16px calc(18px + env(safe-area-inset-bottom)); font-size:11px; color:var(--ink-faint)}
  .appfoot .rmw{cursor:pointer; color:var(--ink-faint); opacity:.55; letter-spacing:.14em; font-weight:600; transition:opacity .15s}
  .appfoot .rmw:hover{opacity:.9}
  .appfoot .rmwc{margin-left:8px; color:var(--ink-soft); font-weight:600}

  /* ---------- Buttons / inputs ---------- */
  .btn{font-family:inherit; font-size:13px; font-weight:600; border-radius:8px; padding:8px 14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; display:inline-flex; gap:7px; align-items:center; white-space:nowrap}
  .btn:hover{border-color:#c3ccd8}
  .btn.primary{background:var(--denim); border-color:var(--denim-dark); color:#fff}
  .btn.primary:hover{background:var(--denim-dark)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px; font-size:12px}
  .btn.danger{color:var(--red); border-color:#e7c4c0}
  .btn.danger:hover{background:#fbeeec}
  input,select,textarea{font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--denim); box-shadow:0 0 0 3px rgba(43,74,126,.12)}
  label.fld{display:block; margin-bottom:12px}
  label.fld .lab{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:5px}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}

  /* ---------- Cards / KPIs ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 16px 15px; box-shadow:var(--shadow); position:relative; overflow:hidden}
  .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--denim)}
  .kpi.k-chalk::before{background:var(--chalk)} .kpi.k-thread::before{background:var(--thread)} .kpi.k-green::before{background:var(--green)}
  .kpi .klab{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint); font-weight:600}
  .kpi .kval{font-size:27px; font-weight:700; margin-top:7px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .kpi .ksub{font-size:12px; color:var(--ink-soft); margin-top:3px}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden}
  .panel-head{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line-soft)}
  .panel-head h3{margin:0; font-size:14.5px; font-weight:700}
  .panel-head .meta{font-size:12px; color:var(--ink-faint)}
  .panel-head .actions{margin-left:auto; display:flex; gap:8px; align-items:center}
  .panel-body{padding:6px 0}
  .panel-pad{padding:18px}

  /* ---------- Tables ---------- */
  table{width:100%; border-collapse:collapse}
  thead th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); font-weight:600; text-align:left; padding:10px 18px; border-bottom:1px solid var(--line-soft)}
  tbody td{padding:11px 18px; border-bottom:1px solid var(--line-soft); vertical-align:middle; font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono); font-size:12.5px; letter-spacing:-.02em}
  .muted{color:var(--ink-soft)}
  .strong{font-weight:600}

  /* ---------- Badges / status pills ---------- */
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px; border:1px solid transparent; white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%}
  .p-grey{background:#eef1f5; color:#5a6477} .p-grey .dot{background:#9aa4b4}
  .p-blue{background:#e7f0fa; color:#235e96} .p-blue .dot{background:#2b6cb0}
  .p-amber{background:#fcf2e0; color:#94660f} .p-amber .dot{background:var(--thread)}
  .p-teal{background:#e2f4f1; color:#15695e} .p-teal .dot{background:var(--chalk)}
  .p-green{background:#e6f4ec; color:#1f6b41} .p-green .dot{background:var(--green)}
  .p-red{background:#fbeae8; color:#9c362c} .p-red .dot{background:var(--red)}
  .p-ink{background:var(--denim-deep); color:#e6ecf6} .p-ink .dot{background:#9FB6E0}

  /* ---------- Production seam (signature) ---------- */
  .seamtrack{display:flex; align-items:stretch; gap:0; margin:2px 0}
  .seamtrack .seg{flex:1; text-align:center; position:relative; padding-top:14px}
  .seamtrack .seg .node{width:13px;height:13px;border-radius:50%;border:2px solid var(--line); background:#fff; position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:2}
  .seamtrack .seg::before{content:""; position:absolute; top:6px; left:0; right:0; height:0; border-top:2px dashed var(--line); z-index:1}
  .seamtrack .seg:first-child::before{left:50%}
  .seamtrack .seg:last-child::before{right:50%}
  .seamtrack .seg.done .node{background:var(--chalk); border-color:var(--chalk)}
  .seamtrack .seg.done::before{border-top-style:solid; border-color:var(--chalk)}
  .seamtrack .seg.active .node{border-color:var(--denim); background:#fff; box-shadow:0 0 0 3px rgba(43,74,126,.15)}
  .seamtrack .seg .lab{font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px; font-weight:600}
  .seamtrack .seg .q{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums}

  .bar{height:7px; background:var(--line-soft); border-radius:20px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--denim); border-radius:20px}
  .bar.teal > i{background:var(--chalk)}

  /* ---------- Toolbar / search ---------- */
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap}
  .search{position:relative; flex:1; min-width:200px; max-width:340px}
  .search input{padding-left:32px}
  .search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint)}
  .filterpills{display:flex; gap:6px; flex-wrap:wrap}
  .fp{font-size:12px; font-weight:600; padding:6px 12px; border:1px solid var(--line); border-radius:20px; background:#fff; cursor:pointer; color:var(--ink-soft)}
  .fp.on{background:var(--ink); border-color:var(--ink); color:#fff}

  .empty{text-align:center; padding:46px 20px; color:var(--ink-soft)}
  .empty .big{font-size:15px; font-weight:600; color:var(--ink); margin-bottom:5px}

  /* ---------- Modal ---------- */
  .scrim{position:fixed; inset:0; background:rgba(16,24,40,.45); backdrop-filter:blur(2px); display:none; z-index:50; align-items:flex-start; justify-content:center; padding:48px 18px; overflow:auto}
  .scrim.open{display:flex}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:560px; box-shadow:0 24px 60px rgba(16,24,40,.32); animation:pop .14s ease}
  .modal.wide{max-width:820px}
  @keyframes pop{from{transform:translateY(8px) scale(.99); opacity:.6}to{transform:none; opacity:1}}
  .modal-head{padding:18px 22px 12px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center}
  .modal-head h3{margin:0; font-size:17px; font-weight:700}
  .modal-head .x{margin-left:auto; cursor:pointer; color:var(--ink-faint); font-size:20px; line-height:1; padding:4px}
  .modal-body{padding:18px 22px; max-height:64vh; overflow:auto}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--line-soft); display:flex; gap:10px; justify-content:flex-end}

  /* ---------- Toast ---------- */
  .toasts{position:fixed; right:20px; bottom:20px; z-index:90; display:flex; flex-direction:column; gap:9px}
  .toast{background:var(--ink); color:#fff; padding:11px 15px; border-radius:9px; font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; gap:9px; align-items:center; animation:slide .18s ease}
  .toast.ok{background:#13433a} .toast.warn{background:#7a4a12} .toast.err{background:#6f2a23}
  @keyframes slide{from{transform:translateX(12px); opacity:0}to{transform:none; opacity:1}}

  .notice{background:#fff7e8; border:1px solid #f0d9a8; color:#7a5610; padding:9px 14px; border-radius:9px; font-size:12.5px; margin-bottom:16px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
  .linklike{color:var(--denim); cursor:pointer; font-weight:600}
  .linklike:hover{text-decoration:underline}
  .tag{font-size:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--ink-soft); display:inline-block}
  .right{margin-left:auto}
  .stat-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line-soft); font-size:13px}
  .stat-line:last-child{border-bottom:none}

  @media (max-width:880px){
    body{grid-template-columns:1fr; grid-template-rows:100vh}
    .mobilebar{display:flex}
    .navscrim{display:block; pointer-events:none}
    body.nav-open .navscrim{pointer-events:auto}
    /* sidebar becomes an off-canvas drawer that slides in from the left */
    .side{
      position:fixed; top:0; left:0; bottom:0; width:264px; height:100vh; height:100dvh; z-index:60;
      flex-direction:column; overflow:hidden; transform:translateX(-100%);
      transition:transform .25s ease; box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    body.nav-open .side{transform:translateX(0)}
    nav{display:block; flex:1; overflow:auto; padding:10px 12px; min-height:0}
    .nav-group{display:block}
    .brand .sub{display:block}
    .nav-item{font-size:14px; padding:11px 12px}
    .side-foot{display:block; flex-shrink:0; padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    .topbar{position:static; padding:14px 16px 10px}
    .topbar h2{font-size:19px}
    .content{padding:16px 15px 70px}
    .kpis{grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px}
    .kpi .kval{font-size:22px}
    .grid2{grid-template-columns:1fr; gap:14px}
    .row2,.row3{grid-template-columns:1fr}
    .topbar .right{flex-wrap:wrap; gap:6px}
    .modal{width:94vw; max-width:94vw}
    .loginwrap{padding:16px}
    .loginbox{padding:26px 22px 22px}
    .scrim{padding:20px 10px}
  }
  @media (max-width:460px){
    .kpis{grid-template-columns:1fr}
  }

  /* ---------- Import dropzone ---------- */
  .dropzone{border:2px dashed var(--line); border-radius:12px; padding:34px 20px; text-align:center; background:var(--surface-2); transition:.15s; cursor:pointer}
  .dropzone:hover,.dropzone.hot{border-color:var(--denim); background:#eef3fb}
  .dropzone .big{font-size:15px; font-weight:700; margin:8px 0 4px}
  .dropzone .sub{font-size:12.5px; color:var(--ink-soft)}
  .dropglyph{font-size:30px; color:var(--denim)}
  .dropoverlay{position:fixed; inset:0; z-index:80; background:rgba(22,36,63,.55); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center}
  .dropoverlay.show{display:flex}
  .dropoverlay .card{background:#fff; border-radius:16px; padding:40px 56px; text-align:center; border:3px dashed var(--denim); box-shadow:0 30px 70px rgba(0,0,0,.35)}
  .dropoverlay .card .big{font-size:20px; font-weight:700; margin-top:10px}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--denim);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .review-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px}
  .review-grid .k{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:600}
  .review-grid .v{font-size:14px; font-weight:600; margin-bottom:4px}
  .matchip{display:inline-flex; gap:6px; align-items:center; font-size:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px 9px; margin:0 6px 6px 0}

  @media print{
    .side,.topbar .right,.no-print{display:none !important}
    body{display:block; background:#fff}
    .main{overflow:visible}
    .topbar{position:static; background:#fff; border:none; padding:0 0 8px}
    .content{padding:0; max-width:none}
    .panel{box-shadow:none; border:1px solid #bbb; break-inside:avoid}
    .kpi{box-shadow:none}
    thead th{color:#000}
    @page{margin:14mm}
  }

  /* ---------- Auth / login ---------- */
  .loginwrap{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#16243F,#0f1a2e 60%,#1E355C); padding:20px}
  .loginwrap.show{display:flex}
  .loginbox{background:#fff; border-radius:16px; width:100%; max-width:392px; padding:34px 34px 28px; box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .loginbox .lmark{display:flex; align-items:center; gap:11px; margin-bottom:22px}
  .loginbox .lmark .stitch{width:34px;height:34px;border:2px dashed var(--denim);border-radius:8px;display:grid;place-items:center;color:var(--denim);font-weight:800}
  .loginbox .lmark h1{margin:0;font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
  .loginbox .lmark .sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
  .loginbox h2{margin:0 0 4px;font-size:16px;font-weight:700}
  .loginbox .lsub{color:var(--ink-soft);font-size:13px;margin-bottom:18px}
  .loginerr{background:#fbeae8;border:1px solid #e7c4c0;color:#9c362c;font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:12px;display:none}
  .loginerr.show{display:block}
  .loginbox .btn.primary{width:100%;justify-content:center;padding:11px;font-size:14px;margin-top:6px}
  .loginhint{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-soft);font-size:12px;color:var(--ink-soft);text-align:center}
  .loginhint code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:11.5px}
  .authlink{display:block;text-align:center;margin-top:12px;font-size:12.5px;color:var(--denim);cursor:pointer;font-weight:600}
  .authlink:hover{text-decoration:underline}
  .codebox{font-family:var(--mono);font-size:19px;letter-spacing:.12em;text-align:center;background:var(--surface-2);border:1px dashed var(--denim);border-radius:10px;padding:16px;margin:12px 0;color:var(--ink);font-weight:700;word-break:break-all}
  .qrwrap{display:flex;justify-content:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px auto;width:fit-content}
  .qrwrap img,.qrwrap canvas,.qrwrap table{display:block}
  .keyline{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-align:center;letter-spacing:.06em;word-break:break-all}

<script>
"use strict";
/* ============================================================
   STORAGE LAYER  (window.storage → localStorage → in-memory)
   ============================================================ */
const DB_KEY = "garment_erp_db_v1";
const SESSION_KEY = "garment_erp_session_v1";
const HAS_STORE = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function");
const HAS_LS = (function(){ try{ window.localStorage.setItem("__seam_t","1"); window.localStorage.removeItem("__seam_t"); return true; }catch(e){ return false; } })();
let MEM = null;              // in-memory DB fallback
let MEM_SESSION = null;      // in-memory session fallback
let PERSIST_OK = HAS_STORE || HAS_LS;

/* ---- Shared database (Firebase Firestore), enabled only when configured ---- */
let FB_ON=false, FB_DOC=null, FB_SUBSCRIBED=false, lastJSON=null;
function firebaseConfigured(){ return !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId); }
function initFirebase(){
  if(FB_ON) return true;
  if(!firebaseConfigured() || typeof firebase==="undefined") return false;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    FB_DOC = firebase.firestore().collection("seam_erp").doc("workspace");
    FB_ON = true; PERSIST_OK = true;
    return true;
  }catch(e){ console.error("Firebase init failed:", e); FB_ON=false; return false; }
}
function subscribeFirebase(){
  if(!FB_ON || FB_SUBSCRIBED) return;
  FB_SUBSCRIBED=true;
  FB_DOC.onSnapshot(snap=>{
    if(!snap.exists) return;
    if(snap.metadata && snap.metadata.hasPendingWrites) return;   // ignore our own write echo
    const d=snap.data(); if(!d||!d.json) return;
    if(d.json===lastJSON) return;                                  // unchanged
    lastJSON=d.json;
    try{ DB=JSON.parse(d.json); }catch(e){ return; }
    // keep the logged-in user object fresh so role/permission changes apply live
    if(CURRENT){
      const me=DB.users.find(u=>u.id===CURRENT.id);
      if(me && me.active){ CURRENT=me; }
      else { doLogout(); return; }
    }
    buildNav();
    if(CURRENT && !$("#scrim").classList.contains("open") && VIEWS[ROUTE]){
      if(!userCanSee(ROUTE)) go(ROUTE); else VIEWS[ROUTE]();  // live refresh / re-gate
    }
  }, err=>{ console.error("Firestore listen failed:", err); });
}

/* Prefer shared Firestore (when configured), else Claude's built-in storage,
   else the browser's localStorage, else memory. Sessions stay per-device. */
async function rawGet(key){
  if(HAS_STORE){ try{ const r=await window.storage.get(key); if(r&&r.value!=null) return r.value; }catch(e){} }
  if(HAS_LS){ try{ const v=window.localStorage.getItem(key); if(v!=null) return v; }catch(e){} }
  return null;
}
async function rawSet(key,val){
  if(HAS_STORE){ try{ await window.storage.set(key,val); PERSIST_OK=true; return true; }catch(e){} }
  if(HAS_LS){ try{ window.localStorage.setItem(key,val); PERSIST_OK=true; return true; }catch(e){} }
  PERSIST_OK=false; return false;
}
async function storeGet(){
  if(FB_ON){
    try{ const snap=await FB_DOC.get(); if(snap.exists){ const d=snap.data(); if(d&&d.json){ lastJSON=d.json; return JSON.parse(d.json); } } return null; }
    catch(e){ console.error("Firestore read failed:", e); }
  }
  const v=await rawGet(DB_KEY); if(v!=null){ try{ return JSON.parse(v); }catch(e){} } return MEM;
}
async function storeSet(db){
  const s=JSON.stringify(db);
  if(FB_ON){
    try{ await FB_DOC.set({json:s, updated:Date.now()}); lastJSON=s; PERSIST_OK=true; return; }
    catch(e){ console.error("Firestore write failed:", e); }
  }
  const ok=await rawSet(DB_KEY, s); if(!ok) MEM=db;
}
async function sessionGet(){ const v=await rawGet(SESSION_KEY); if(v!=null){ try{ return JSON.parse(v); }catch(e){} } return MEM_SESSION; }
async function sessionSet(v){ const ok=await rawSet(SESSION_KEY, JSON.stringify(v)); if(!ok) MEM_SESSION=v; }

/* password hashing — SHA-256(salt:password), with a weak fallback if crypto.subtle is unavailable */
function randSalt(){
  if(window.crypto&&crypto.getRandomValues){ const a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join(""); }
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}
async function hashPassword(pw, salt){
  const data = salt+":"+pw;
  if(window.crypto&&crypto.subtle){
    try{
      const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }catch(e){/* fall through */}
  }
  // fallback (non-cryptographic) — only used if SubtleCrypto is missing
  let h=5381; for(let i=0;i<data.length;i++){ h=((h<<5)+h+data.charCodeAt(i))>>>0; }
  return "fb"+h.toString(16);
}

/* ---- recovery codes ---- */
function generateRecoveryCode(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no ambiguous chars
  const grp=()=>{ let s=""; const r=new Uint8Array(4); (window.crypto?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.random()*256)); for(const b of r) s+=A[b%A.length]; return s; };
  return grp()+"-"+grp()+"-"+grp()+"-"+grp();
}

/* ---- TOTP (RFC 6238) for Google Authenticator / Authy ---- */
const B32="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function base32Encode(bytes){ let bits=0,val=0,out=""; for(const b of bytes){ val=(val<<8)|b; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } } if(bits>0) out+=B32[(val<<(5-bits))&31]; return out; }
function base32Decode(s){ s=String(s).toUpperCase().replace(/=+$/,"").replace(/\s/g,""); let bits=0,val=0; const out=[]; for(const c of s){ const idx=B32.indexOf(c); if(idx<0) continue; val=(val<<5)|idx; bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&0xff); bits-=8; } } return new Uint8Array(out); }
function generateTOTPSecret(){ const a=new Uint8Array(20); (window.crypto?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256)); return base32Encode(a); }
async function hmacSha1(keyBytes, msgBytes){
  const key=await crypto.subtle.importKey("raw",keyBytes,{name:"HMAC",hash:"SHA-1"},false,["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC",key,msgBytes));
}
async function totpAt(secretB32, ms){
  const key=base32Decode(secretB32);
  const counter=Math.floor((ms/1000)/30);
  const buf=new ArrayBuffer(8); new DataView(buf).setUint32(4, counter>>>0);
  const hm=await hmacSha1(key, new Uint8Array(buf));
  const off=hm[hm.length-1]&0xf;
  const bin=((hm[off]&0x7f)<<24)|((hm[off+1]&0xff)<<16)|((hm[off+2]&0xff)<<8)|(hm[off+3]&0xff);
  return String(bin%1000000).padStart(6,"0");
}
async function verifyTOTP(secret, token, win=1){
  token=String(token).replace(/\D/g,""); if(token.length!==6) return false;
  if(!(window.crypto&&crypto.subtle)) return false;
  const now=Date.now();
  for(let e=-win;e<=win;e++){ if(await totpAt(secret, now+e*30000)===token) return true; }
  return false;
}
function otpauthURI(user, secret){
  const issuer="Seam ERP";
  return `otpauth://totp/${encodeURIComponent(issuer)}:${encodeURIComponent(user)}?secret=${secret}&issuer=${encodeURIComponent(issuer)}&algorithm=SHA1&digits=6&period=30`;
}

function bomFor(poId){ return DB.bom.filter(m=>m.poId===poId); }

  const items=bomFor(poId); if(!items.length) return {pct:0,done:0,total:0};
  const done=items.filter(m=>m.status==="Received").length;

function productionProgress(po){
  const prod=po.production||{}; const target=Number(po.quantity||0)||1;
  let sum=0; STAGES.forEach(s=> sum+=Math.min(Number(prod[s]||0),target));
  return Math.round((sum/(target*STAGES.length))*100);
}

async function initData(){

  if(!DB.lines) DB.lines=[{id:uid("ln"),name:"Production Line 1"},{id:uid("ln"),name:"Production Line 2"}];

  if(!DB.chequeLayout) DB.chequeLayout=defaultChequeLayout();
  if(!DB.inventory) DB.inventory=seedInventory();
  if(!DB.issues) DB.issues=[];
  if(!DB.subfactories) DB.subfactories=["D & S CLOTHING","R T FASHION","DILKI - I GARMENT","NIMTOP - ATHURUGIRIYA","NIMTOP - KULIYAPITIYA"].map(n=>({id:uid("sf"),name:n}));
  if(!DB.subcontract) DB.subcontract=[];
  if(!DB.subCut) DB.subCut={};   // poId → total cut qty released to sub-contracting
  // roles (non-admin roles are label + optional default tab access; admin is a power role)
  if(!DB.roles) DB.roles=[
    {key:"user",label:"Staff",admin:false},
    {key:"manager",label:"Manager",admin:false},
    {key:"accountant",label:"Accountant",admin:false},
    {key:"supervisor",label:"Production Supervisor",admin:false},
    {key:"storekeeper",label:"Store Keeper",admin:false},
    {key:"admin",label:"Administrator",admin:true},
  ];
  if(!DB.roleTabs) DB.roleTabs={};   // roleKey → array of allowed tab ids (default-applied on user create); missing = all
  if(!DB.activity) DB.activity=[];   // super-admin activity log
  syncSuppliersFromInventory();      // backfill Suppliers list from inventory supplier names
  // ensure a super admin exists (the first/earliest admin is promoted)
  if(DB.users.length && !DB.users.some(u=>u.superadmin)){
    const admins=DB.users.filter(u=>u.role==="admin").sort((a,b)=>String(a.created||"").localeCompare(String(b.created||"")));
    if(admins[0]) admins[0].superadmin=true;
  }
  // drop any throwaway default admin from older versions
  DB.users = DB.users.filter(u=>!u.isDefault);
  // auto-purge recycle bin items older than 30 days
  const before=DB.trash.length;
  const cutoff=Date.now()-30*86400000;
  DB.trash=DB.trash.filter(t=>Number(t.deletedAt||0)>=cutoff);
  if(DB.trash.length!==before) await storeSet(DB);
}

const TRASH_LABEL={buyer:"Buyer",supplier:"Supplier",po:"Purchase order",shipment:"Shipment",daily:"Daily production",inventory:"Inventory item",subcontract:"Sub-contract production"};
function trashPush(type,label,payload){
  DB.trash.push({tid:uid("trash"),type,label,payload,deletedAt:Date.now(),deletedBy:CURRENT?CURRENT.username:""});
}
async function softDeleteBuyer(id){
  const b=DB.buyers.find(x=>x.id===id); if(!b) return;
  logAct("Deleted buyer","Buyers", b.name);
  trashPush("buyer", b.name, {buyer:b});
  DB.buyers=DB.buyers.filter(x=>x.id!==id); await save();
}
async function softDeleteSupplier(id){
  const s=DB.suppliers.find(x=>x.id===id); if(!s) return;
  logAct("Deleted supplier","Suppliers", s.name);
  trashPush("supplier", s.name, {supplier:s});
  DB.bom.forEach(m=>{ if(m.supplierId===id) m.supplierId=""; });
  DB.suppliers=DB.suppliers.filter(x=>x.id!==id); await save();
}
async function softDeletePO(id){
  const p=DB.pos.find(x=>x.id===id); if(!p) return;
  logAct("Deleted PO","Purchase Orders", p.poNumber+" · "+p.garment);
  const bom=DB.bom.filter(m=>m.poId===id);
  const ships=DB.shipments.filter(s=>s.poId===id);
  const daily=DB.daily.filter(d=>d.poId===id);
  const sub=DB.subcontract.filter(d=>d.poId===id);
  trashPush("po", p.poNumber+" · "+p.garment, {po:p,bom,ships,daily,sub});
  DB.pos=DB.pos.filter(x=>x.id!==id);
  DB.bom=DB.bom.filter(m=>m.poId!==id);
  DB.shipments=DB.shipments.filter(s=>s.poId!==id);
  DB.daily=DB.daily.filter(d=>d.poId!==id);
  DB.subcontract=DB.subcontract.filter(d=>d.poId!==id);
  await save();
}
async function softDeleteShip(id){

  logAct("Deleted shipment","Export", (s.invoiceNo||"Shipment")+" · "+num(s.qty)+" pcs");
  trashPush("shipment", (s.invoiceNo||"Shipment")+" · "+num(s.qty)+" pcs", {shipment:s});

async function softDeleteDaily(id){

async function softDeleteInventory(id){

async function softDeleteSub(id){

  const po=poByNumber(d.poId);
  logAct("Deleted sub-contract entry","Sub Contract", fmtDate(d.date)+" · "+subName(d.subId)+" · "+num(d.qty)+" pcs");
  trashPush("subcontract", fmtDate(d.date)+" · "+subName(d.subId)+" · "+num(d.qty)+" pcs", {sub:d});

async function restoreTrash(tid){
  const t=DB.trash.find(x=>x.tid===tid); if(!t) return;
  const p=t.payload;
  if(t.type==="buyer" && p.buyer) DB.buyers.push(p.buyer);
  if(t.type==="supplier" && p.supplier) DB.suppliers.push(p.supplier);
  if(t.type==="po" && p.po){ DB.pos.push(p.po); (p.bom||[]).forEach(m=>DB.bom.push(m)); (p.ships||[]).forEach(s=>DB.shipments.push(s)); (p.daily||[]).forEach(d=>DB.daily.push(d)); (p.sub||[]).forEach(d=>DB.subcontract.push(d)); }
  if(t.type==="shipment" && p.shipment) DB.shipments.push(p.shipment);
  if(t.type==="daily" && p.daily) DB.daily.push(p.daily);
  if(t.type==="inventory" && p.inventory) DB.inventory.push(p.inventory);
  if(t.type==="subcontract" && p.sub) DB.subcontract.push(p.sub);
  DB.trash=DB.trash.filter(x=>x.tid!==tid);
  await save();
}
async function purgeTrash(tid){ DB.trash=DB.trash.filter(x=>x.tid!==tid); await save(); }

const CONTROLLABLE_TABS = ["dashboard","pos","buyers","inventory","materials","suppliers","daily","subcontract","production","wip","export","cheque"];
const ALWAYS_ALLOWED = ["account"];
function userCanSee(route){
  if(route==="issues") route="inventory";   // issue notes follow inventory access
  if(SUPER_ROUTES.includes(route)) return isSuperAdmin();
  if(isAdmin()) return true;
  if(ALWAYS_ALLOWED.includes(route)) return true;
  if(ADMIN_ROUTES.includes(route)) return false;
  const allowed = CURRENT && CURRENT.allowedTabs;
  if(!allowed) return true;                 // no restriction set → sees all operational tabs
  return allowed.includes(route);
}
function buildNav(){
  const groups = NAV.filter(g=> (!g.admin || isAdmin()) && (!g.super || isSuperAdmin()));

    return `<div class="nav-group">${g.grp}</div>`+
    items.map(it=>{
      const b=navBadge(it.id);

        <span class="ico">${it.ico}</span><span>${it.label}</span>${b?`<span class="badge">${b}</span>`:""}</div>`;

const SUPER_ROUTES = ["superadmin"];
function go(route){
  if(!CURRENT){ showLogin(); return; }
  closeNav();   // close the mobile drawer whenever we navigate
  if(SUPER_ROUTES.includes(route) && !isSuperAdmin()){ toast("Super administrator only","warn"); route="dashboard"; }
  if(ADMIN_ROUTES.includes(route) && !isAdmin()){ toast("Administrators only","warn"); route="dashboard"; }
  if(!userCanSee(route)){
    // land on the first tab this user is allowed to see
    const first=CONTROLLABLE_TABS.find(t=>userCanSee(t)) || "account";
    route=first;
  }
  ROUTE=route; buildNav(); VIEWS[route] ? VIEWS[route]() : VIEWS.dashboard(); $(".main").scrollTo({top:0});
}

function openModal({title,fields,record={},submitLabel="Save",onSubmit,wide=false}){
  const html = fields.map(f=>fieldHTML(f, record[f.name])).join("");
  $("#modal").className = "modal"+(wide?" wide":"");
  $("#modal").innerHTML = `
    <div class="modal-head"><h3>${esc(title)}</h3><div class="x" id="mx">×</div></div>
    <div class="modal-body"><form id="mform" onsubmit="return false">${html}</form></div>
    <div class="modal-foot">
      <button class="btn ghost" id="mcancel">Cancel</button>
      <button class="btn primary" id="msave">${esc(submitLabel)}</button>
    </div>`;
  $("#scrim").classList.add("open");
  $("#mx").onclick=closeModal; $("#mcancel").onclick=closeModal;
  $("#msave").onclick=()=>{
    const data={}; let ok=true;
    fields.forEach(f=>{
      const el=$("#mform [name='"+f.name+"']"); if(!el) return;
      let v = el.value;
      if(f.type==="number") v = v===""?"":Number(v);
      if(f.required && (v===""||v==null)){ el.style.borderColor="var(--red)"; ok=false; }
      data[f.name]=v;
    });
    if(!ok){ toast("Please complete the required fields","warn"); return; }
    onSubmit(data);
  };
  const first=$("#mform input,#mform select,#mform textarea"); if(first) first.focus();
}
function fieldHTML(f,val){
  val = val==null?(f.default!=null?f.default:""):val;
  const lab=`<span class="lab">${esc(f.label)}${f.required?" *":""}</span>`;
  let ctrl="";
  if(f.type==="select"){
    ctrl=`<select name="${f.name}">${(f.options||[]).map(o=>{
      const ov=typeof o==="object"?o.value:o, ol=typeof o==="object"?o.label:o;
      return `<option value="${esc(ov)}" ${String(ov)===String(val)?"selected":""}>${esc(ol)}</option>`;
    }).join("")}</select>`;
  } else if(f.type==="textarea"){
    ctrl=`<textarea name="${f.name}" rows="${f.rows||3}">${esc(val)}</textarea>`;
  } else {
    let listAttr="", dl="";
    if(f.list && f.list.length){
      const lid="dl_"+f.name+"_"+Math.random().toString(36).slice(2,6);
      listAttr=`list="${lid}"`;
      dl=`<datalist id="${lid}">${f.list.slice(0,500).map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`;
    }
    ctrl=`<input name="${f.name}" type="${f.type||"text"}" value="${esc(val)}" ${listAttr} ${f.step?`step="${f.step}"`:""} ${f.min!=null?`min="${f.min}"`:""} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""} autocomplete="off">${dl}`;
  }
  return `<label class="fld" style="${f.half?"":"grid-column:1/-1"}">${lab}${ctrl}</label>`;
}

function invDistinct(field){

}

function poPillCell(s){ return pill(s, poPill(s)); }

function buildAlerts(){
  const items=[];
  DB.bom.filter(m=>m.status==="In Transit"||m.status==="Ordered").forEach(m=>{
    const d=daysFromNow(m.eta);
    if(m.eta && d!=null && d<7){
      const po=poByNumber(m.poId);
      items.push({t:`${m.material} for ${po?po.poNumber:"?"} — ${m.status.toLowerCase()}, ETA ${fmtDate(m.eta)}`,cls:"p-amber"});
    }
  });
  DB.bom.filter(m=>m.status==="Required").forEach(m=>{
    const po=poByNumber(m.poId);
    items.push({t:`${m.material} for ${po?po.poNumber:"?"} not yet ordered`,cls:"p-red"});
  });
  DB.pos.forEach(p=>{
    const d=daysFromNow(p.deliveryDate);
    if(d!=null && d<14 && !["Shipped","Completed"].includes(p.status)){
      items.push({t:`${p.poNumber} delivery in ${d} day${d===1?"":"s"} — currently ${p.status}`,cls:d<5?"p-red":"p-amber"});
    }
  });
  if(!items.length) return `<div class="muted" style="font-size:13px">All clear — no urgent material or delivery flags.</div>`;
  return items.slice(0,8).map(i=>`<div class="stat-line"><span style="font-size:13px">${esc(i.t)}</span><span>${pill(i.cls==="p-red"?"urgent":"soon",i.cls)}</span></div>`).join("");
}
function workflowGuide(){
  const steps=[["1","Receive buyer PO","Sales → Purchase Orders"],["2","Define Bill of Materials","Open a PO → Materials tab"],
    ["3","Order & import raw material","Procurement → Raw Material & Import"],["4","Run production stages","Operations → Production"],
    ["5","Export to buyer","Operations → Export & Shipment"]];
  return steps.map(s=>`<div class="stat-line"><span><b style="color:var(--denim)">${s[0]}.</b> ${s[1]}</span><span class="muted" style="font-size:12px">${s[2]}</span></div>`).join("");
}

/* all factory + sub-contract production logged against this PO — makes the PO sheet a full record */
function poProductionEntriesHTML(p){
  const fac=(DB.daily||[]).filter(e=>e.poId===p.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const sub=(DB.subcontract||[]).filter(e=>e.poId===p.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!fac.length && !sub.length) return "";
  const facQty=fac.reduce((a,e)=>a+Number(e.qty||0),0), subQty=sub.reduce((a,e)=>a+Number(e.qty||0),0);
  const facInc=fac.reduce((a,e)=>a+dailyIncome(e),0), subInc=sub.reduce((a,e)=>a+subIncome(e),0);
  const totOut=facQty+subQty, bal=Number(p.quantity||0)-totOut;
  const facRows=fac.map(e=>`<tr><td class="num">${fmtDate(e.date)}</td><td><span class="tag">Factory</span> ${esc(lineName(e.lineId))}</td><td class="num strong">${num(e.qty)}</td><td class="num">${cmMoney(e.cmPrice,e.currency)}</td><td class="num">${cmMoney(dailyIncome(e),e.currency)}</td></tr>`).join("");
  const subRows=sub.map(e=>`<tr><td class="num">${fmtDate(e.date)}</td><td><span class="tag">Sub</span> ${esc(subName(e.subId))}</td><td class="num strong">${num(e.qty)}</td><td class="num">${cmMoney(subNetCM(e),e.currency)}</td><td class="num">${cmMoney(subIncome(e),e.currency)}</td></tr>`).join("");
  return `<div class="panel"><div class="panel-head"><h3>Production entries for this PO</h3>
    <div class="meta">factory ${num(facQty)} · sub-contract ${num(subQty)} · total ${num(totOut)} / ${num(p.quantity)}${bal>0?" · balance "+num(bal):(bal<0?" · over by "+num(-bal):" · complete")}</div></div>
    <div class="panel-body" style="overflow-x:auto"><table>

/* order lines in a sensible column order so a colour × size grid reads naturally */
const SIZE_ORDER=["XXS","XS","S","M","L","XL","XXL","XXXL","2XL","3XL","1X","2X","3X","OS"];
function sizeColsFor(lines){
  const set=new Set();
  lines.forEach(l=>{ const sb=l.sizeBreakdown; if(sb) Object.keys(sb).forEach(s=>set.add(s)); });
  return [...set].sort((a,b)=>{ let ia=SIZE_ORDER.indexOf(a), ib=SIZE_ORDER.indexOf(b);
    if(ia<0) ia=99; if(ib<0) ib=99; return ia-ib || a.localeCompare(b,undefined,{numeric:true}); });
}
// colour × size breakdown table (shows each colour part separately), used in review + PO detail
function colourSizeTableHTML(lines,cur){
  const L=(lines||[]).filter(l=>l&&l.sizeBreakdown&&Object.keys(l.sizeBreakdown).length);
  if(L.length<1) return "";
  const cols=sizeColsFor(L);
  const colTot={}; cols.forEach(c=>colTot[c]=0); let grand=0;
  const body=L.map((l,idx)=>{
    const sb=l.sizeBreakdown||{}; let rowTot=0;
    const cells=cols.map(c=>{ const v=Number(sb[c]||0); colTot[c]+=v; rowTot+=v; return `<td class="num">${v?num(v):"·"}</td>`; }).join("");
    grand+=rowTot;
    const price=Number(l.price||0);
    return `<tr><td class="strong">${esc(l.color||l.style||("Part "+(idx+1)))}${l.pack?` <span class="muted" style="font-size:11px">· ${esc(l.pack)}</span>`:""}</td>${cells}<td class="num strong">${num(rowTot)}</td>${price?`<td class="num">${money(price,cur)}</td>`:""}</tr>`;
  }).join("");
  const anyPrice=L.some(l=>Number(l.price||0));
  const footCells=cols.map(c=>`<td class="num strong">${num(colTot[c])}</td>`).join("");
  return `<table>
    <thead><tr><th>Colour part</th>${cols.map(c=>`<th class="num">${esc(c)}</th>`).join("")}<th class="num">Total</th>${anyPrice?"<th class=\"num\">Price</th>":""}</tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td class="strong">Total</td>${footCells}<td class="num strong">${num(grand)}</td>${anyPrice?"<td></td>":""}</tr></tfoot>
  </table>`;
}
function poColourBreakdownHTML(p){
  const L=poLines(p);
  if(L.length<2 && !(L[0]&&L[0].sizeBreakdown)) return "";
  const tbl=colourSizeTableHTML(L,p.currency);
  if(!tbl) return "";
  return `<div class="panel"><div class="panel-head"><h3>Colour / size breakdown</h3><div class="meta">${L.length} colour part${L.length===1?"":"s"} · ${num(p.quantity)} pcs</div></div>
    <div class="panel-body" style="overflow-x:auto">${tbl}</div></div>`;
}
function seamHTML(p){
  const prod=p.production||{}; const cur=currentStage(p); const target=Number(p.quantity||0);
  return `<div class="seamtrack">`+STAGES.map(s=>{
    const q=Number(prod[s]||0); const done=q>=target&&target>0; const active=(s===cur);

      <div class="lab">${esc(s)}</div><div class="q">${num(q)}/${num(target)}</div></div>`;
  }).join("")+`</div>`;
}

let PROD_SEARCH="";
async function setStage(poId,stage,val){
  const p=DB.pos.find(x=>x.id===poId); if(!p) return;
  if(!p.production) p.production={};
  p.production[stage]=Math.max(0,Number(val||0));
  autoStatus(p); await save(); VIEWS.production();
}
async function fillStages(poId){
  const p=DB.pos.find(x=>x.id===poId); if(!p) return;
  STAGES.forEach(s=> p.production[s]=Number(p.quantity||0));
  autoStatus(p); await save(); VIEWS.production(); toast("All stages complete — ready to ship","ok");
}
function autoStatus(p){
  const target=Number(p.quantity||0); const prod=p.production||{};
  const anyStarted=STAGES.some(s=>Number(prod[s]||0)>0);
  const allDone=target>0 && STAGES.every(s=>Number(prod[s]||0)>=target);
  if(["Shipped","Completed"].includes(p.status)) return;
  if(allDone) p.status="Ready to Ship";
  else if(anyStarted) p.status="In Production";
  else if(p.status==="In Production") p.status="Confirmed";
}

/* ============================================================
   DAILY PRODUCTION  (line + date + PO → qty × CM = CM income)
   ============================================================ */
const lineName = id => (DB.lines.find(l=>l.id===id)||{}).name || "—";
function monthKey(d){ return (d||"").slice(0,7); }        // YYYY-MM
function thisMonth(){ return today().slice(0,7); }
function cmMoney(n,cur){ return money(n,cur||"USD"); }
function dailyIncome(e){ return Number(e.qty||0)*Number(e.cmPrice||0); }

VIEWS.daily=function(){
  const admin=isAdmin();
  setHead("Operations","Daily Production",
    `${admin?`<button class="btn" onclick="manageLines()">Manage lines</button> `:""}<button class="btn primary" onclick="editDaily()">+ Add production</button>`);
  if(!DB.pos.length){ return emptyState("Add a purchase order first","Daily production is logged against an existing PO.","go('pos')","Open orders"); }

  // filters
  DAILY_FILTER.month = DAILY_FILTER.month || thisMonth();
  const dq=(DAILY_FILTER.q||"").trim().toLowerCase();
  const months = Array.from(new Set(DB.daily.map(e=>monthKey(e.date)))).filter(Boolean).sort().reverse();
  if(!months.includes(DAILY_FILTER.month)) months.unshift(DAILY_FILTER.month);
  let rows = DB.daily.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"") );
  if(DAILY_FILTER.line!=="All") rows=rows.filter(e=>e.lineId===DAILY_FILTER.line);
  if(dq){   // PO/style search runs across all months
    rows=rows.filter(e=>{ const po=poByNumber(e.poId); const hay=((po?po.poNumber:"")+" "+(e.style||(po?po.style:"")||"")+" "+(po?po.garment:"")).toLowerCase(); return hay.includes(dq); });
  } else {
    rows = rows.filter(e=> monthKey(e.date)===DAILY_FILTER.month);
  }

  // KPIs
  const allMonth = DB.daily.filter(e=>monthKey(e.date)===DAILY_FILTER.month);
  const monthQty = allMonth.reduce((a,e)=>a+Number(e.qty||0),0);
  const monthCM = allMonth.reduce((a,e)=>a+dailyIncome(e),0);
  const lastDate = DB.daily.reduce((mx,e)=> (e.date>mx?e.date:mx), "");
  const lastQty = DB.daily.filter(e=>e.date===lastDate).reduce((a,e)=>a+Number(e.qty||0),0);

  const body = rows.length?rows.map(e=>{
    const po=poByNumber(e.poId);
    return `<tr>

      <div class="filterpills">${lineTabs}</div>
      <input id="dSearch" placeholder="Search PO or style…" value="${esc(DAILY_FILTER.q)}" style="flex:1;min-width:140px;max-width:280px">
      ${dq?`<button class="btn sm" id="dSearchClear">Clear</button>`:""}
    </div>
    <div class="panel"><div class="panel-head"><h3>Production log</h3><div class="meta">${rows.length} entr${rows.length===1?"y":"ies"}${dq?" · matching “"+esc(DAILY_FILTER.q)+"”":""}</div></div>
      <div class="panel-body" style="overflow-x:auto"><table>
        <thead><tr><th class="num">Date</th><th>Line</th><th>PO</th><th>Style</th><th class="num">Order</th><th class="num">Made</th><th class="num">CM price</th><th class="num">CM income</th><th></th></tr></thead>
        <tbody>${body}</tbody></table></div></div>
    <div class="panel"><div class="panel-head"><h3>Month summary by order</h3><div class="meta">${DAILY_FILTER.month}</div></div>
      <div class="panel-pad">${poSummary}
        <div class="stat-line" style="border-top:2px solid var(--line);margin-top:6px;padding-top:10px"><span class="strong">Total</span><span class="strong">${num(monthQty)} pcs · ${cmMoney(monthCM)}</span></div>
      </div></div>`;
  $("#dmonth").onchange=e=>{ DAILY_FILTER.month=e.target.value; VIEWS.daily(); };
  $$(".fp").forEach(f=> f.onclick=()=>{ DAILY_FILTER.line=f.dataset.l; VIEWS.daily(); });
  const dse=$("#dSearch"); if(dse) dse.oninput=e=>{ DAILY_FILTER.q=e.target.value; const v=e.target.value; VIEWS.daily(); const n=$("#dSearch"); if(n){ n.focus(); n.value=v; n.selectionStart=n.selectionEnd=v.length; } };
  const dsc=$("#dSearchClear"); if(dsc) dsc.onclick=()=>{ DAILY_FILTER.q=""; VIEWS.daily(); };
};

function editDaily(id){

  const poOptions = DB.pos.map(p=>`<option value="${p.id}" ${e&&e.poId===p.id?"selected":""}>${esc(p.poNumber+" · "+p.garment)}</option>`).join("");
  const lineOptions = DB.lines.map(l=>`<option value="${l.id}" ${e&&e.lineId===l.id?"selected":""}>${esc(l.name)}</option>`).join("");
  $("#modal").className="modal wide";
  $("#modal").innerHTML=`
    <div class="modal-head"><h3>${id?"Edit production entry":"Add daily production"}</h3><div class="x" id="mx">×</div></div>
    <div class="modal-body">
      <div class="row2">
        <label class="fld"><span class="lab">Production line *</span><select id="d_line">${lineOptions}</select></label>
        <label class="fld"><span class="lab">Date *</span><input id="d_date" type="date" value="${e?e.date:today()}"></label>
      </div>
      <label class="fld"><span class="lab">Purchase order *</span><select id="d_po"><option value="">— select PO —</option>${poOptions}</select></label>
      <div id="d_poinfo" class="notice" style="display:none;margin-top:0"></div>
      <div class="row2">
        <label class="fld"><span class="lab">Quantity made today *</span><input id="d_qty" type="number" min="0" value="${e?e.qty:""}" placeholder="pieces"></label>
        <label class="fld"><span class="lab">CM price (per piece) *</span><input id="d_cm" type="number" step="0.01" min="0" value="${e?e.cmPrice:""}" placeholder="cut & make rate"></label>
      </div>
      <div class="panel-pad" style="background:var(--surface-2);border-radius:10px;display:flex;justify-content:space-between;align-items:center">
        <span class="muted" style="font-size:12.5px;text-transform:uppercase;letter-spacing:.08em">Daily CM income (auto)</span>
        <span id="d_income" class="strong" style="font-size:20px;font-variant-numeric:tabular-nums">—</span>
      </div>
    </div>

  $("#mx").onclick=closeModal; $("#mcancel").onclick=closeModal;
  const poSel=$("#d_po"), infoBox=$("#d_poinfo");
  function refreshPO(){
    const po=poByNumber(poSel.value);
    if(po){ infoBox.style.display="block"; infoBox.innerHTML=`<b>Style:</b> ${esc(po.style||"—")} &nbsp;·&nbsp; <b>Garment:</b> ${esc(po.garment)} &nbsp;·&nbsp; <b>Order qty:</b> ${num(po.quantity)} &nbsp;·&nbsp; <b>Currency:</b> ${esc(po.currency||"USD")}`; }
    else { infoBox.style.display="none"; }
    recalc();
  }
  function recalc(){
    const q=Number($("#d_qty").value||0), cm=Number($("#d_cm").value||0);
    const po=poByNumber(poSel.value);
    $("#d_income").textContent=cmMoney(q*cm, po?po.currency:"USD");
  }
  poSel.onchange=refreshPO; $("#d_qty").oninput=recalc; $("#d_cm").oninput=recalc;
  refreshPO();
  $("#d_save").onclick=async()=>{
    const lineId=$("#d_line").value, date=$("#d_date").value, poId=poSel.value;
    const qty=Number($("#d_qty").value||0), cmPrice=Number($("#d_cm").value||0);
    if(!lineId||!date||!poId){ toast("Line, date and PO are required","warn"); return; }
    if(qty<=0){ toast("Enter the quantity made","warn"); return; }
    const po=poByNumber(poId);
    const rec={lineId,date,poId,qty,cmPrice,
      style:po?po.style:"", orderQty:po?po.quantity:0, currency:po?po.currency:"USD",
      cmIncome:qty*cmPrice};
    if(id){ Object.assign(e,rec); }
    else { DB.daily.push({id:uid("dp"),...rec,enteredBy:CURRENT?CURRENT.username:"",createdAt:Date.now()}); }
    logAct(id?"Edited daily production":"Added daily production","Daily Production", (po?po.poNumber+" · ":"")+num(qty)+" pcs");
    await save(); closeModal(); VIEWS.daily(); toast(id?"Entry updated":"Production added","ok");
  };
}

  };

async function removeLine(id){
  if(DB.daily.some(d=>d.lineId===id)){ toast("Line has production entries — can't remove","warn"); return; }
  DB.lines=DB.lines.filter(l=>l.id!==id); await save(); manageLines();
}

/* ============================================================
   SUB CONTRACT PRODUCTION  (work given to outside factories)
   Net CM = CM price + Cost adjustment − Sub-contract charges
   Income = Net CM × Daily out
   ============================================================ */
const subName = id => (DB.subfactories.find(s=>s.id===id)||{}).name || "—";
function subNetCM(e){ return Number(e.cmPrice||0)+Number(e.costAdj||0)-Number(e.subCharges||0); }
function subIncome(e){ return subNetCM(e)*Number(e.qty||0); }
function subTotalOut(poId,exceptId){ return DB.subcontract.filter(d=>d.poId===poId && d.id!==exceptId).reduce((a,d)=>a+Number(d.qty||0),0); }
function subCutQty(poId){ return Number((DB.subCut||{})[poId]||0); }
const SUB_FILTER={month:"",sub:"All",from:"",to:"",q:""};
function subInRange(e){
  if(SUB_FILTER.from && (e.date||"")<SUB_FILTER.from) return false;
  if(SUB_FILTER.to && (e.date||"")>SUB_FILTER.to) return false;
  return true;
}

VIEWS.subcontract=function(){
  const admin=isAdmin();
  setHead("Operations","Sub Contract Production",
    `<button class="btn" onclick="exportSubcontract()">⬆ Export Excel</button> ${admin?`<button class="btn" onclick="manageSubfactories()">Manage sub-factories</button> `:""}<button class="btn primary" onclick="editSub()">+ Add production</button>`);
  if(!DB.pos.length){ return emptyState("Add a purchase order first","Sub-contract production is logged against an existing PO.","go('pos')","Open orders"); }

  SUB_FILTER.month = SUB_FILTER.month || thisMonth();
  const rangeActive = !!(SUB_FILTER.from || SUB_FILTER.to);
  const periodLabel = rangeActive ? ((SUB_FILTER.from?fmtDate(SUB_FILTER.from):"…")+" → "+(SUB_FILTER.to?fmtDate(SUB_FILTER.to):"…")) : SUB_FILTER.month;
  const months = Array.from(new Set(DB.subcontract.map(e=>monthKey(e.date)))).filter(Boolean).sort().reverse();
  if(!months.includes(SUB_FILTER.month)) months.unshift(SUB_FILTER.month);
  // the set shown = date range when a range is set, otherwise the selected month
  let base = DB.subcontract.slice();
  if(SUB_FILTER.sub!=="All") base=base.filter(e=>e.subId===SUB_FILTER.sub);
  const allMonth = rangeActive ? base.filter(subInRange) : base.filter(e=>monthKey(e.date)===SUB_FILTER.month);
  const sq=(SUB_FILTER.q||"").trim().toLowerCase();
  let rows;
  if(sq){   // PO/style search runs across all periods (sub-factory filter still applies)
    rows=base.filter(e=>{ const po=poByNumber(e.poId); const hay=((po?po.poNumber:"")+" "+(e.style||(po?po.style:"")||"")+" "+(po?po.garment:"")).toLowerCase(); return hay.includes(sq); }).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  } else {
    rows = allMonth.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"") );
  }

  const monthQty = allMonth.reduce((a,e)=>a+Number(e.qty||0),0);
  const monthInc = allMonth.reduce((a,e)=>a+subIncome(e),0);
  const lastDate = DB.subcontract.reduce((mx,e)=> (e.date>mx?e.date:mx), "");
  const lastQty = DB.subcontract.filter(e=>e.date===lastDate).reduce((a,e)=>a+Number(e.qty||0),0);

  const body = rows.length?rows.map(e=>{
    const po=poByNumber(e.poId);
    return `<tr>
      <td class="num">${fmtDate(e.date)}</td>
      <td>${esc(subName(e.subId))}</td>
      <td>${po?`<span class="linklike" onclick="openPO('${e.poId}')">${esc(po.poNumber)}</span>`:"—"}</td>
      <td>${esc(e.style||(po?po.style:"")||"—")}</td>
      <td class="num strong">${num(e.qty)}</td>
      <td class="num">${cmMoney(e.cmPrice,e.currency)}</td>
      <td class="num">${Number(e.costAdj||0)>=0?"+":""}${cmMoney(e.costAdj,e.currency)}</td>
      <td class="num">${cmMoney(e.subCharges,e.currency)}</td>
      <td class="num strong">${cmMoney(subNetCM(e),e.currency)}</td>
      <td class="num strong">${cmMoney(subIncome(e),e.currency)}</td>
      <td class="num"><button class="btn sm" onclick="editSub('${e.id}')">Edit</button>
        ${canDelete()?`<button class="btn sm danger" onclick="delSub('${e.id}')">Delete</button>`:""}</td></tr>`;
  }).join("") : `<tr><td colspan="11" class="muted" style="text-align:center;padding:28px">No sub-contract production for this month${SUB_FILTER.sub!=="All"?" at this sub-factory":""}.</td></tr>`;

  // month summary by sub-factory
  const bySub={};
  allMonth.forEach(e=>{ const k=e.subId; if(!bySub[k]) bySub[k]={qty:0,inc:0}; bySub[k].qty+=Number(e.qty||0); bySub[k].inc+=subIncome(e); });
  const subSummary=Object.entries(bySub).map(([sid,v])=>`<div class="stat-line"><span>${esc(subName(sid))}</span><span class="strong">${num(v.qty)} pcs · ${cmMoney(v.inc)}</span></div>`).join("") || `<div class="muted" style="font-size:13px">No entries yet.</div>`;

  // per-PO progress: cut qty vs total out vs balance (all time, across sub-factories)
  const poIds=Array.from(new Set(DB.subcontract.map(e=>e.poId)));
  const poProgress=poIds.map(pid=>{
    const po=poByNumber(pid); const cut=subCutQty(pid); const out=subTotalOut(pid,null); const bal=cut-out;
    const pct=cut>0?Math.min(100,Math.round(out/cut*100)):0;
    return `<div style="margin-bottom:10px">
      <div class="stat-line" style="border:none;padding:2px 0"><span>${po?esc(po.poNumber+" · "+(po.style||po.garment)):"—"}</span>
        <span class="strong">${num(out)} / ${cut?num(cut):"—"} out${cut?` · bal ${num(bal)}`:""}</span></div>
      ${cut>0?`<div style="height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden"><div style="height:100%;width:${pct}%;background:${bal<0?'var(--danger,#d9534f)':'var(--accent,#2e7d6b)'}"></div></div>`:""}</div>`;
  }).join("") || `<div class="muted" style="font-size:13px">No cut quantity recorded yet.</div>`;

  const subTabs = `<div class="fp ${SUB_FILTER.sub==="All"?"on":""}" data-s="All">All sub-factories</div>`+
    DB.subfactories.map(s=>`<div class="fp ${SUB_FILTER.sub===s.id?"on":""}" data-s="${s.id}">${esc(s.name)}</div>`).join("");

  $("#view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="klab">Last production day</div><div class="kval">${num(lastQty)}</div><div class="ksub">${lastDate?fmtDate(lastDate):"—"}</div></div>
      <div class="kpi k-chalk"><div class="klab">Output</div><div class="kval">${num(monthQty)}</div><div class="ksub">pieces · ${periodLabel}</div></div>
      <div class="kpi k-green"><div class="klab">CM income</div><div class="kval" style="font-size:22px">${cmMoney(monthInc)}</div><div class="ksub">net CM × out · ${periodLabel}</div></div>
      <div class="kpi k-thread"><div class="klab">Sub-factories</div><div class="kval">${DB.subfactories.length}</div><div class="ksub">${allMonth.length} entries in period</div></div>
    </div>
    <div class="toolbar">
      <select id="smonth" style="max-width:150px" ${rangeActive?"disabled title='Clear dates to use month'":""}>${months.map(m=>`<option ${m===SUB_FILTER.month?"selected":""}>${m}</option>`).join("")}</select>
      <div class="filterpills">${subTabs}</div>
    </div>
    <div class="toolbar" style="margin-top:-6px">
      <span class="muted" style="font-size:12.5px">Date range:</span>
      <input id="sFrom" type="date" value="${SUB_FILTER.from||""}" style="max-width:160px" ${sq?"disabled":""}>
      <span class="muted">→</span>
      <input id="sTo" type="date" value="${SUB_FILTER.to||""}" style="max-width:160px" ${sq?"disabled":""}>
      ${rangeActive?`<button class="btn sm" id="sDateClear">Clear dates</button>`:""}
      <input id="sSearch" placeholder="Search PO or style…" value="${esc(SUB_FILTER.q||"")}" style="flex:1;min-width:140px;max-width:260px">
      ${sq?`<button class="btn sm" id="sSearchClear">Clear</button>`:""}
    </div>
    <div class="panel"><div class="panel-head"><h3>Sub-contract production log</h3><div class="meta">${rows.length} entr${rows.length===1?"y":"ies"} · ${sq?"matching “"+esc(SUB_FILTER.q)+"”":periodLabel}</div></div>
      <div class="panel-body" style="overflow-x:auto"><table>
        <thead><tr><th class="num">Date</th><th>Sub-factory</th><th>PO</th><th>Style</th><th class="num">Daily out</th><th class="num">CM price</th><th class="num">Cost adj</th><th class="num">Sub charges</th><th class="num">Net CM</th><th class="num">Income</th><th></th></tr></thead>
        <tbody>${body}</tbody></table></div></div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h3>Summary by sub-factory</h3><div class="meta">${periodLabel}</div></div>
        <div class="panel-pad">${subSummary}
          <div class="stat-line" style="border-top:2px solid var(--line);margin-top:6px;padding-top:10px"><span class="strong">Total</span><span class="strong">${num(monthQty)} pcs · ${cmMoney(monthInc)}</span></div>
        </div></div>
      <div class="panel"><div class="panel-head"><h3>Cut qty progress by PO</h3><div class="meta">out vs balance (all sub-factories)</div></div>
        <div class="panel-pad">${poProgress}</div></div>
    </div>`;
  $("#smonth").onchange=e=>{ SUB_FILTER.month=e.target.value; VIEWS.subcontract(); };
  $("#sFrom").onchange=e=>{ SUB_FILTER.from=e.target.value; VIEWS.subcontract(); };
  $("#sTo").onchange=e=>{ SUB_FILTER.to=e.target.value; VIEWS.subcontract(); };
  const sdc=$("#sDateClear"); if(sdc) sdc.onclick=()=>{ SUB_FILTER.from=""; SUB_FILTER.to=""; VIEWS.subcontract(); };
  const sse=$("#sSearch"); if(sse) sse.oninput=e=>{ SUB_FILTER.q=e.target.value; const v=e.target.value; VIEWS.subcontract(); const n=$("#sSearch"); if(n){ n.focus(); n.value=v; n.selectionStart=n.selectionEnd=v.length; } };
  const ssc=$("#sSearchClear"); if(ssc) ssc.onclick=()=>{ SUB_FILTER.q=""; VIEWS.subcontract(); };
  $$(".fp").forEach(f=> f.onclick=()=>{ SUB_FILTER.sub=f.dataset.s; VIEWS.subcontract(); });
};

   CHEQUE PRINTING  (amount → words, drag-to-align, print)
   ============================================================ */
const MM_PX = 3.7795275591;              // px per mm at 96dpi
let CHEQUE = { payee:"", amount:"", date:today(), memo:"" };
let CQ_SEL = null;                        // selected field key

function numToWords(n){
  n=Math.floor(Math.abs(Number(n)||0));
  if(n===0) return "Zero";
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const three=num=>{ let s=""; const h=Math.floor(num/100), r=num%100;
    if(h){ s+=ones[h]+" Hundred"; if(r) s+=" "; }
    if(r){ if(r<20) s+=ones[r]; else { s+=tens[Math.floor(r/10)]; if(r%10) s+=" "+ones[r%10]; } }
    return s; };
  const scales=["","Thousand","Million","Billion","Trillion"];
  const groups=[]; while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
  let words="";
  for(let g=groups.length-1;g>=0;g--){ if(groups[g]) words+=(words?" ":"")+three(groups[g])+(scales[g]?" "+scales[g]:""); }
  return words.trim();
}
function amountToWords(amount, curWord, centWord, only){
  amount=Number(amount)||0;
  const whole=Math.floor(amount), cents=Math.round((amount-whole)*100);
  let s=numToWords(whole)+(curWord?" "+curWord:"");
  if(cents>0) s+=" and "+numToWords(cents)+(centWord?" "+centWord:"");
  if(only) s+=" Only";
  return s;
}
function chequeFigures(amount){
  const L=DB.chequeLayout;
  const f=(Number(amount)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (L.figuresGuard?"**":"")+f;
}
function chequeDateStr(d){
  if(!d) return "";
  const t=new Date(d+"T00:00:00"); if(isNaN(t)) return d;
  const dd=String(t.getDate()).padStart(2,"0"), mm=String(t.getMonth()+1).padStart(2,"0"), yy=t.getFullYear();
  return dd+"/"+mm+"/"+yy;
}
function chequeFieldsHTML(){
  const L=DB.chequeLayout, D=CHEQUE;
  const map={
    date:chequeDateStr(D.date),
    payee:D.payee||"",
    words:amountToWords(D.amount||0,L.currencyWord,L.centWord,L.onlySuffix),
    figures:chequeFigures(D.amount||0),
    acpayee:"A/C PAYEE ONLY",
    memo:D.memo||""
  };
  let html="";
  Object.keys(L.fields).forEach(key=>{
    const f=L.fields[key]; if(!f||f.show===false) return;
    if((key==="memo"||key==="acpayee") && !map[key]) { if(key==="memo"&&!D.memo) return; }
    const st=`left:${f.x}mm;top:${f.y}mm;font-size:${f.size}mm;`+
      (f.width?`width:${f.width}mm;`:"")+(f.lh?`line-height:${f.lh}mm;`:"")+
      (key==="date"&&L.dateSpacing?`letter-spacing:${L.dateSpacing}mm;`:"");
    html+=`<div class="cf" data-field="${key}" style="${st}">${esc(map[key]||"")}</div>`;
  });
  return html;
}
function renderChequeSheets(){
  const L=DB.chequeLayout;
  const inner=chequeFieldsHTML();
  const sheet=$("#chequeSheet");
  if(sheet){
    const stageW=Math.min(660, ($("#cqStage")? $("#cqStage").clientWidth-32 : 620));
    const k=Math.min(1, stageW/(L.width*MM_PX));
    sheet.style.width=L.width+"mm"; sheet.style.height=L.height+"mm";
    sheet.style.transform="scale("+k+")";
    sheet.dataset.k=k;
    const stage=$("#cqStage"); if(stage){ stage.style.height=(L.height*MM_PX*k+2)+"px"; }
    sheet.innerHTML=inner;
    sheet.querySelectorAll(".cf").forEach(el=>{
      if(el.dataset.field===CQ_SEL) el.classList.add("sel");
      el.onpointerdown=e=>startFieldDrag(e, el, k);
    });
  }
  const psheet=$("#chequePrintSheet");
  if(psheet){ psheet.style.width=L.width+"mm"; psheet.style.height=L.height+"mm"; psheet.innerHTML=inner; }
  else {
    $("#chequePrint").innerHTML=`<div id="chequePrintSheet" style="position:relative;width:${L.width}mm;height:${L.height}mm">${inner}</div>`;
  }
}
function startFieldDrag(e, el, k){
  e.preventDefault();
  const key=el.dataset.field, f=DB.chequeLayout.fields[key];
  CQ_SEL=key; $$("#chequeSheet .cf").forEach(x=>x.classList.toggle("sel",x===el));
  const sx=e.clientX, sy=e.clientY, ox=f.x, oy=f.y;
  el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{
    f.x=Math.max(0,Math.min(DB.chequeLayout.width,  ox+(ev.clientX-sx)/(k*MM_PX)));
    f.y=Math.max(0,Math.min(DB.chequeLayout.height, oy+(ev.clientY-sy)/(k*MM_PX)));
    el.style.left=f.x+"mm"; el.style.top=f.y+"mm";
    syncFieldInputs(key);
  };
  el.onpointerup=ev=>{ el.onpointermove=null; el.onpointerup=null; try{el.releasePointerCapture(ev.pointerId);}catch(_){}
    const ps=$("#chequePrintSheet"); if(ps) ps.innerHTML=chequeFieldsHTML(); };
}
function syncFieldInputs(key){
  const f=DB.chequeLayout.fields[key];
  const xi=$("#cqx_"+key), yi=$("#cqy_"+key);
  if(xi) xi.value=Math.round(f.x*10)/10; if(yi) yi.value=Math.round(f.y*10)/10;
}

   INVENTORY MANAGEMENT  (stock ledger: received / issued / balance)
   ============================================================ */
const INV_CATS=["Fabric","Trim","Packing","Accessories","Sample","Other"];
function invBalance(it){ return Number(it.received||0)-Number(it.issued||0)-Number(it.adjust||0); }
function invValue(it){ return invBalance(it)*Number(it.unitPrice||0); }
function invLow(it){ const r=Number(it.reorder||0); return r>0 && invBalance(it)<=r; }
const INV_FILTER={cat:"All",q:"",supplier:"All",status:"All",hideZero:true,from:"",to:""};

function invFilteredRows(){
  let rows=(DB.inventory||[]).slice();
  if(INV_FILTER.cat!=="All") rows=rows.filter(i=>i.category===INV_FILTER.cat);
  if(INV_FILTER.supplier!=="All") rows=rows.filter(i=>(i.supplier||"")===INV_FILTER.supplier);
  if(INV_FILTER.from) rows=rows.filter(i=>i.date && i.date>=INV_FILTER.from);   // in-house date period
  if(INV_FILTER.to) rows=rows.filter(i=>i.date && i.date<=INV_FILTER.to);
  if(INV_FILTER.status==="Low") rows=rows.filter(invLow);
  if(INV_FILTER.hideZero) rows=rows.filter(i=>invBalance(i)>0);   // auto-hide zero-balance stock
  if(INV_FILTER.q){ const q=INV_FILTER.q.toLowerCase(); rows=rows.filter(i=>
    (i.code||"").toLowerCase().includes(q)||(i.grn||"").toLowerCase().includes(q)||(i.item||"").toLowerCase().includes(q)||
    (i.supplier||"").toLowerCase().includes(q)||(i.color||"").toLowerCase().includes(q)||(i.po||"").toLowerCase().includes(q)); }
  rows.sort((a,b)=>(a.category+a.item).localeCompare(b.category+b.item));
  return rows;
}

function normHdr(s){ return String(s==null?"":s).replace(/\s+/g," ").trim().toUpperCase(); }
function xlDate(v){
  if(v==null||v==="") return "";
  if(typeof v==="number" && window.XLSX && XLSX.SSF){ try{ const s=XLSX.SSF.format("yyyy-mm-dd", v); if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; }catch(e){} }
  if(v instanceof Date){ return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`; }
  const d=new Date(v); if(isNaN(d)) return ""; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
async function handleInvExcel(file){
  if(typeof XLSX==="undefined"){ toast("Excel reader didn't load — check your connection","warn"); return; }
  importLoading("Reading "+file.name);
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const cat=($("#invImpCat")&&$("#invImpCat").value)||"Fabric";
    // pick the sheet: one whose name mentions FABRIC IN, else the first
    let sheetName=wb.SheetNames.find(n=>/FABRIC\s*IN/i.test(n)) || wb.SheetNames[0];
    const ws=wb.Sheets[sheetName];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    // find header row: the row containing CODE and ITEM
    let hr=-1;
    for(let i=0;i<Math.min(grid.length,15);i++){
      const H=(grid[i]||[]).map(normHdr);
      if(H.includes("CODE") && H.some(x=>/ITEM/.test(x))){ hr=i; break; }
    }
    if(hr<0) throw new Error("Couldn't find the header row (needs columns like CODE, Supplier, Item, In-house Yds).");
    const H=(grid[hr]||[]).map(normHdr);
    const col=(...names)=>{ for(const nm of names){ const idx=H.findIndex(h=>h===nm||h.replace(/\n/g," ").replace(/\s+/g," ")===nm); if(idx>=0) return idx; }
      for(const nm of names){ const idx=H.findIndex(h=>h.includes(nm)); if(idx>=0) return idx; } return -1; };
    const ci={ code:col("CODE"), date:col("INHOUSE DATE","IN HOUSE DATE","DATE"), po:col("PO NUMBER","PO"),
      invoice:col("INVOICE NUMBER","INVOICE"), supplier:col("SUPPLIER"), item:col("ITEM NAME","ITEM"),
      color:col("COLOR","COLOUR"), received:col("IN HOUSE YDS","INHOUSE YDS","IN HOUSE","RECEIVED"),
      price:col("UNIT PRICE","UNITPRICE"), issued:col("ISSUE YDS","ISSUED"), remark:col("REMARK"),
      style:col("STYLE"), balance:col("BALANCE YDS","BALANCE") };
    if(ci.code<0||ci.item<0) throw new Error("The sheet is missing a Code or Item column.");
    const num=v=>{ const n=Number(String(v==null?"":v).replace(/,/g,"")); return isNaN(n)?0:n; };
    const get=(row,k)=> (ci[k]>=0 && ci[k]<row.length)? row[ci[k]] : null;
    const rows=[]; let adjRows=0;
    for(let i=hr+1;i<grid.length;i++){
      const row=grid[i]||[]; const code=get(row,"code");
      if(code==null||String(code).trim()==="") continue;
      const item=get(row,"item");
      if((item==null||String(item).trim()==="")) continue;
      const received=num(get(row,"received")), issued=num(get(row,"issued"));
      // honour the sheet's own BALANCE YDS (wastage / factory-balance adjustment) if present
      let adjust=0;
      if(ci.balance>=0){ const bcell=get(row,"balance"); if(bcell!=null && String(bcell).trim()!==""){
        const a=(received-issued)-num(bcell); if(Math.abs(a)>0.005){ adjust=Math.round(a*1000)/1000; adjRows++; }
      }}
      rows.push({
        code:String(code).trim(), category:cat, date:xlDate(get(row,"date")),
        supplier:String(get(row,"supplier")||"").trim(), item:String(item).trim(),
        color:String(get(row,"color")||"").trim(), unit:(cat==="Fabric"?"yds":"pcs"),
        received, issued, adjust, unitPrice:num(get(row,"price")), reorder:0,
        po:String(get(row,"po")||"").trim(), invoice:String(get(row,"invoice")||"").trim(),
        style:String(get(row,"style")||"").trim(), remark:String(get(row,"remark")||"").trim()
      });
    }
    if(!rows.length) throw new Error("No data rows with a Code were found.");
    // compute new vs update by code (within same category)
    const existing={}; (DB.inventory||[]).forEach(it=>{ if(it.code) existing[it.code.toLowerCase()]=it; });
    let upd=0,nw=0; rows.forEach(r=>{ existing[r.code.toLowerCase()]?upd++:nw++; });
    INV_IMPORT={rows,newCount:nw,updCount:upd,category:cat,sheet:sheetName,adjRows};
    reviewInvImport();
  }catch(e){
    $("#modal").className="modal";
    $("#modal").innerHTML=`<div class="modal-head"><h3>Couldn't read that file</h3><div class="x" id="mx">×</div></div>
      <div class="modal-body"><p class="muted" style="font-size:14px">${esc(e&&e.message?e.message:"Unknown error")}</p>

function nextIssueNo(){
  const nums=(DB.issues||[]).map(n=>{ const m=(n.noteNo||"").match(/(\d+)\s*$/); return m?Number(m[1]):0; });
  const mx=nums.length?Math.max(...nums):0;

}
function openIssueNote(){
  const items=(DB.inventory||[]).filter(i=>invBalance(i)>0).sort((a,b)=>(a.item||"").localeCompare(b.item||""));
  if(!items.length){ toast("No items with stock to issue","warn"); return; }
  // label → itemId map for a type-to-filter datalist
  const labelOf=i=>(i.code?i.code+" · ":"")+i.item+(i.color&&i.color!=="—"?" · "+i.color:"")+"  (bal "+num(invBalance(i))+" "+(i.unit||"")+")";
  const labelToId={}; items.forEach(i=>{ labelToId[labelOf(i)]=i.id; });
  const dlOpts=items.map(i=>`<option value="${esc(labelOf(i))}">`).join("");
  ISSUE_LINES=[{itemId:"",qty:""}];
  const render=()=>{
    const lineRows=ISSUE_LINES.map((ln,idx)=>{
      const it=DB.inventory.find(x=>x.id===ln.itemId);
      const bal=it?invBalance(it):0;
      return `<div class="fieldrow" style="grid-template-columns:1fr 120px 96px 30px">
        <input class="issel" data-li="${idx}" list="issDL" placeholder="type to search item…" value="${esc(it?labelOf(it):(ln.typed||""))}" autocomplete="off">
        <input type="number" min="0" class="isqty" data-li="${idx}" value="${ln.qty}" placeholder="qty" style="width:110px" ${it?`max="${bal}"`:""}>
        <span class="muted" style="font-size:12px;${it&&Number(ln.qty)>bal?"color:var(--red)":""}">${it?("bal "+num(bal)):""}</span>
        <button class="btn sm danger" data-del="${idx}" ${ISSUE_LINES.length>1?"":"style=visibility:hidden"}>✕</button>
      </div>`;
    }).join("");
    $("#issLines").innerHTML=lineRows;
    $$("#issLines .issel").forEach(s=> s.oninput=e=>{
      const v=e.target.value, li=+e.target.dataset.li;
      ISSUE_LINES[li].typed=v;
      const id=labelToId[v];
      if(id){ ISSUE_LINES[li].itemId=id; render(); setTimeout(()=>{ const q=$(`#issLines .isqty[data-li="${li}"]`); if(q) q.focus(); },0); }
      else { ISSUE_LINES[li].itemId=""; }
    });
    $$("#issLines .isqty").forEach(s=> s.oninput=e=>{ ISSUE_LINES[+e.target.dataset.li].qty=e.target.value; const li=+e.target.dataset.li; const it=DB.inventory.find(x=>x.id===ISSUE_LINES[li].itemId); if(it){ const sp=e.target.parentElement.querySelector("span"); if(sp) sp.style.color=(Number(e.target.value)>invBalance(it))?"var(--red)":""; } updIssTotals(); });
    $$("#issLines [data-del]").forEach(b=> b.onclick=e=>{ ISSUE_LINES.splice(+e.currentTarget.dataset.del,1); render(); });
    updIssTotals();
  };
  const updIssTotals=()=>{
    let q=0,v=0; ISSUE_LINES.forEach(ln=>{ const it=DB.inventory.find(x=>x.id===ln.itemId); const n=Number(ln.qty||0); if(it&&n>0){ q+=n; v+=n*Number(it.unitPrice||0); } });
    const el=$("#issTotalVal"); if(el) el.textContent=num(q)+" yds · "+money(v,"USD");
  };
  $("#modal").className="modal wide";
  $("#modal").innerHTML=`
    <div class="modal-head"><h3>Fabric Issue Note</h3><div class="x" id="mx">×</div></div>
    <div class="modal-body">
      <div class="row3">
        <label class="fld"><span class="lab">Issue Note No *</span><input id="iss_no" value="${esc(nextIssueNo())}"></label>
        <label class="fld"><span class="lab">Date *</span><input id="iss_date" type="date" value="${today()}"></label>
        <label class="fld"><span class="lab">Issued to / dept</span><input id="iss_to" placeholder="e.g. Cutting"></label>
      </div>
      <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:6px 0">Items to issue</div>
      <datalist id="issDL">${dlOpts}</datalist>
      <div id="issLines"></div>
      <button class="btn sm" id="iss_add" style="margin-top:8px">+ Add line</button>
      <label class="fld" style="margin-top:12px"><span class="lab">Remark</span><input id="iss_remark"></label>
      <div id="issTotals" class="panel-pad" style="background:var(--surface-2);border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <span class="muted" style="font-size:12.5px;text-transform:uppercase;letter-spacing:.06em">Total issue</span>
        <span class="strong" style="font-size:16px" id="issTotalVal">0 · $0.00</span></div>
      <div class="notice" style="margin:10px 0 0">Stock can never go negative — each quantity must be within the item's balance.</div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mcancel">Cancel</button>
      <button class="btn primary" id="iss_save">Issue &amp; reduce stock</button></div>`;
  $("#scrim").classList.add("open");
  $("#mx").onclick=closeModal; $("#mcancel").onclick=closeModal;
  render();
  $("#iss_add").onclick=()=>{ ISSUE_LINES.push({itemId:"",qty:""}); render(); };
  $("#iss_save").onclick=commitIssueNote;
}
let ISSUE_LINES=[];
async function commitIssueNote(){
  const noteNo=$("#iss_no").value.trim(), date=$("#iss_date").value, to=$("#iss_to").value.trim(), remark=$("#iss_remark").value.trim();
  if(!noteNo||!date){ toast("Issue Note No and Date are required","warn"); return; }
  // build & validate lines
  const need={}; const lines=[];
  for(const ln of ISSUE_LINES){
    if(!ln.itemId) continue;
    const q=Number(ln.qty||0);
    if(q<=0){ toast("Enter a quantity for each item line","warn"); return; }
    need[ln.itemId]=(need[ln.itemId]||0)+q;
    lines.push({itemId:ln.itemId, qty:q});
  }
  if(!lines.length){ toast("Add at least one item line","warn"); return; }
  // no-negative check (sum per item vs balance)
  for(const itemId in need){
    const it=DB.inventory.find(x=>x.id===itemId);
    if(!it){ toast("An item was not found","warn"); return; }
    if(need[itemId]>invBalance(it)){ toast(`Not enough stock for ${it.item} — balance ${num(invBalance(it))}`,"warn"); return; }
  }
  // apply: increase issued, snapshot line details
  const snap=lines.map(l=>{ const it=DB.inventory.find(x=>x.id===l.itemId); it.issued=Number(it.issued||0)+l.qty;
    return {itemId:l.itemId, code:it.code||"", item:it.item||"", color:it.color||"", unit:it.unit||"", qty:l.qty}; });
  DB.issues.unshift({id:uid("iss"),noteNo,date,to,remark,by:CURRENT?CURRENT.username:"",createdAt:Date.now(),lines:snap});
  logAct("Fabric issue","Inventory", "Note "+noteNo+" · "+lines.length+" line(s)");
  await save(); closeModal(); VIEWS.inventory(); toast("Issued on note "+noteNo,"ok");
}

function reverseIssue(id){
  const n=(DB.issues||[]).find(x=>x.id===id); if(!n) return;
  confirmModal("Reverse issue note",`Add back the issued quantities of ${esc(n.noteNo)} and remove this note?`,async()=>{
    (n.lines||[]).forEach(l=>{ const it=DB.inventory.find(x=>x.id===l.itemId); if(it) it.issued=Math.max(0,Number(it.issued||0)-Number(l.qty||0)); });
    DB.issues=DB.issues.filter(x=>x.id!==id); await save(); closeModal(); VIEWS.issues(); toast("Issue reversed — stock restored","ok");
  },false);
}
