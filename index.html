VIEWS.wip=function(){
  setHead("Operations","WIP Report",`<button class="btn no-print" onclick="window.print()">🖨 Print / PDF</button>`);
  const rows = DB.pos.filter(p=>p.status!=="Draft");
  if(!rows.length){ return emptyState("Nothing in progress","Confirm an order to see work-in-progress across cutting, sewing, finishing, QC and packing.","go('pos')","Open orders"); }

  // totals
  const T={order:0,Cutting:0,Sewing:0,Finishing:0,"Quality Check":0,Packing:0,shipped:0};
  const body = rows.map(p=>{
    const pr=p.production||{}; const order=Number(p.quantity||0);
    const cut=Number(pr.Cutting||0),sew=Number(pr.Sewing||0),fin=Number(pr.Finishing||0),qc=Number(pr["Quality Check"]||0),pak=Number(pr.Packing||0);
    const shipped=shippedQty(p.id);
    const wipFloor=Math.max(0,cut-pak);          // units inside the line
    const ready=Math.max(0,pak-shipped);          // packed, not yet shipped
    const balShip=Math.max(0,order-shipped);      // remaining to ship
    const pct=productionProgress(p);
    T.order+=order;T.Cutting+=cut;T.Sewing+=sew;T.Finishing+=fin;T["Quality Check"]+=qc;T.Packing+=pak;T.shipped+=shipped;
    return `<tr class="clk" data-po="${p.id}">
      <td><div class="strong">${esc(p.poNumber)}</div><div class="muted" style="font-size:12px">${esc(p.garment)}</div></td>
      <td>${poPillCell(p.status)}</td>
      <td class="num strong">${num(order)}</td>
      <td class="num">${num(cut)}</td><td class="num">${num(sew)}</td><td class="num">${num(fin)}</td>
      <td class="num">${num(qc)}</td><td class="num">${num(pak)}</td>
      <td class="num">${num(shipped)}</td>
      <td class="num" style="color:var(--thread);font-weight:600">${num(wipFloor)}</td>
      <td class="num">${num(ready)}</td>
      <td class="num strong">${num(balShip)}</td>
      <td class="num"><div class="bar" style="width:70px;display:inline-block"><i style="width:${pct}%"></i></div> ${pct}%</td>
    </tr>`;
  }).join("");
  const tWipFloor=Math.max(0,T.Cutting-T.Packing), tReady=Math.max(0,T.Packing-T.shipped), tBal=Math.max(0,T.order-T.shipped);
  const foot=`<tr style="background:var(--surface-2);font-weight:700">
    <td>Totals</td><td></td><td class="num">${num(T.order)}</td>
    <td class="num">${num(T.Cutting)}</td><td class="num">${num(T.Sewing)}</td><td class="num">${num(T.Finishing)}</td>
    <td class="num">${num(T["Quality Check"])}</td><td class="num">${num(T.Packing)}</td><td class="num">${num(T.shipped)}</td>
    <td class="num" style="color:var(--thread)">${num(tWipFloor)}</td><td class="num">${num(tReady)}</td><td class="num">${num(tBal)}</td><td></td></tr>`;

  // process WIP summary (units sitting between consecutive stages)
  const seq=[["Cut → Sew",T.Cutting-T.Sewing],["Sew → Finish",T.Sewing-T.Finishing],["Finish → QC",T.Finishing-T["Quality Check"]],["QC → Pack",T["Quality Check"]-T.Packing],["Pack → Ship",T.Packing-T.shipped]];

  $("#view").innerHTML=`
    <div class="kpis no-print">
      <div class="kpi"><div class="klab">Total on order</div><div class="kval">${num(T.order)}</div><div class="ksub">${rows.length} active orders</div></div>
      <div class="kpi k-thread"><div class="klab">WIP on floor</div><div class="kval">${num(tWipFloor)}</div><div class="ksub">cut but not yet packed</div></div>
      <div class="kpi k-chalk"><div class="klab">Packed, ready</div><div class="kval">${num(tReady)}</div><div class="ksub">awaiting export</div></div>
      <div class="kpi k-green"><div class="klab">Balance to ship</div><div class="kval">${num(tBal)}</div><div class="ksub">order minus shipped</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Work-in-Progress by order</h3><div class="meta">${DB.meta?.company||"Garment ERP"} · ${fmtDate(today())}</div></div>
      <div class="panel-body" style="overflow-x:auto"><table>
        <thead><tr><th>PO / Style</th><th>Status</th><th class="num">Order</th><th class="num">Cut</th><th class="num">Sew</th><th class="num">Finish</th><th class="num">QC</th><th class="num">Pack</th><th class="num">Shipped</th><th class="num">WIP</th><th class="num">Ready</th><th class="num">Bal.</th><th class="num">%</th></tr></thead>
        <tbody>${body}${foot}</tbody></table></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h3>Process WIP summary</h3><div class="meta">units between stages</div></div>
        <div class="panel-pad">${seq.map(([k,v])=>`<div class="stat-line"><span>${esc(k)}</span><span class="strong" style="color:${v>0?'var(--thread)':'var(--ink-soft)'}">${num(Math.max(0,v))} pcs</span></div>`).join("")}</div></div>
      <div class="panel"><div class="panel-head"><h3>How WIP is read</h3></div>
        <div class="panel-pad" style="font-size:13px;color:var(--ink-soft);line-height:1.7">
          <b style="color:var(--ink)">WIP</b> = units cut but not yet packed (sitting inside the line).<br>
          <b style="color:var(--ink)">Ready</b> = packed but not yet shipped.<br>
          <b style="color:var(--ink)">Balance</b> = order quantity still to ship.<br>
          Update stage outputs under <span class="linklike" onclick="go('production')">Production</span>; this report recalculates live.</div></div>
    </div>`;
  $$(".clk").forEach(r=> r.onclick=()=>openPO(r.dataset.po));
};

  $("#mx").onclick=closeModal; $("#mcancel").onclick=closeModal;
  const dz=$("#dz"), inp=$("#dzfile");
  dz.onclick=()=>inp.click();
  inp.onchange=()=>{ if(inp.files[0]) handlePOFile(inp.files[0]); };
  ["dragover","dragenter"].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add("hot");}));
  ["dragleave","drop"].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove("hot");}));
  dz.addEventListener("drop",ev=>{ ev.stopPropagation(); const f=ev.dataTransfer.files[0]; if(f) handlePOFile(f); });
}

function fileToBase64(file){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>res(String(r.result).split(",")[1]);
    r.onerror=()=>rej(new Error("Could not read file")); r.readAsDataURL(file); });
}
async function handlePOFile(file){
  if(file.type!=="application/pdf" && !/\.pdf$/i.test(file.name)){ toast("Please drop a PDF file","warn"); return; }
  importLoading("Reading "+file.name);
  // 1) Free, in-browser reader (pdf.js) tuned to the Active Plus / Shiran PO format.
  try{
    if(window.pdfjsLib){
      const layout=await pdfExtractLayout(file);
      const data=parseShiranPO(layout);
      if(data && data.poNumber && Number(data.quantity)>0){ reviewImport(data); return; }
      // partial parse — still show what we got so the user can complete it
      if(data && (data.poNumber || data.garment)){ reviewImport(data); return; }
    }
  }catch(e){ console.error("Local PO parse failed:", e); }
  // 2) Optional AI fallback if a proxy is configured (not required)
  try{
    if((typeof window!=="undefined" && window.AI_PROXY_URL) || HAS_STORE){
      const b64=await fileToBase64(file);
      const data=await extractPOviaAI(b64);
      reviewImport(data); return;
    }
  }catch(err){ importError(err && err.message ? err.message : "Couldn't read the PO automatically."); return; }
  importError("Couldn't read this PO automatically. It may be a scan or a different layout. Enter it manually or load the sample.");
}

/* ---- pdf.js: extract page text as visual rows (like a printout) ---- */
async function pdfExtractLayout(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  const maxP=Math.min(pdf.numPages, 10);
  for(let p=1;p<=maxP;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    // group items into visual rows. Some PO templates render one row with
    // tiny baseline shifts (e.g. a big style-code sits a few px below "STYLE#",
    // and the price/USD a px above) — a fixed y-grid would split these across
    // lines and scramble "STYLE# … DDP 7.6300 USD". So we CHAIN-cluster: walk
    // items top→bottom and keep adding to the current row while the baseline
    // gap stays small, starting a new row only at a real line break.
    const items=tc.items.filter(it=>it.str && it.str.trim())
                        .map(it=>({x:it.transform[4], y:it.transform[5], s:it.str}));
    items.sort((a,b)=> (b.y - a.y) || (a.x - b.x));   // top→bottom (pdf y is bottom-up)
    const TOL=4;   // px — within this of the previous baseline = same visual row
    const rowsArr=[]; let cur=null, lastY=null;
    for(const it of items){
      if(cur && Math.abs(it.y-lastY)<=TOL){ cur.push(it); }
      else { cur=[it]; rowsArr.push(cur); }
      lastY=it.y;
    }
    const lines=rowsArr.map(row=> row.sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ").replace(/\s+/g," ").trim());
    pages.push(lines);
  }
  return pages;   // array of pages, each an array of line strings
}

/* ---- parser for the Active Plus Trading / Shiran Clothing PO template ---- */
function parseShiranPO(pages){
  const page1=pages[0]||[];
  const allLines=pages.flat();
  const text=allLines.join("\n");
  const find=(re)=>{ const m=text.match(re); return m?(m[1]!=null?m[1]:m[0]).trim():""; };
  const mdyToISO=(s)=>{ const m=(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m) return ""; let[_,mm,dd,yy]=m; if(yy.length===2) yy="20"+yy; return `${yy}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`; };

  // PO number: first standalone 6-digit number near the top
  let poNumber=""; for(const ln of page1.slice(0,12)){ const m=ln.match(/\b(\d{6})\b/); if(m){ poNumber=m[1]; break; } }
  if(!poNumber){ const m=text.match(/\b(\d{6})\b/); if(m) poNumber=m[1]; }

  // Customer / buyer
  const custLine=find(/CUSTOMER:\s*(.+?)\s+(?:ETD:|$)/);
  let buyer="";
  if(custLine && !/STOCK|ZSTOCK/i.test(custLine)){
    buyer=custLine.replace(/^[A-Z0-9]{3,6}\s*-\s*/,"").trim();   // strip leading code "M010A - "
  } else {
    // top-of-page brand (text before "PURCHASE ORDER" on line 1)
    const top=(page1[0]||"").split(/PURCHASE ORDER/i)[0].trim();
    buyer=(/@@/.test(top)||!top)?"BCI Brands LLC":top;
  }

  const headerQty=Number((find(/TOTAL QTY:\s*([\d,]+)\s*EA/)||"0").replace(/,/g,""))||0;
  const style=find(/STYLE#\s*([A-Za-z0-9\-]+)/);
  const body=find(/BODY#\s*:?\s*([A-Za-z0-9\-]+)/);
  const hts=find(/HTS#\s*([\d.]{6,})/);
  const division=find(/DIVISION:\s*([A-Za-z0-9]+)/);
  const theme=find(/THEME[ \t]+([A-Za-z0-9]+)/);
  const shipVia=find(/SHIP VIA:\s*([A-Za-z]+)/);
  const shipTerms=find(/PURCHASE TERMS:\s*([A-Za-z0-9 ]+?)\s{2,}/)||find(/PURCHASE TERMS:\s*([A-Za-z0-9]+(?:\s+\d+\s+DAYS)?)/);
  const etd=mdyToISO(find(/ETD:\s*(\d{1,2}\/\d{1,2}\/\d{4})/));
  const eta=mdyToISO(find(/ETA:\s*(\d{1,2}\/\d{1,2}\/\d{4})/));
  const issue=mdyToISO(find(/ISSUE DATE:\s*(\d{1,2}\/\d{1,2}\/\d{4})/));
  const fabricPo=find(/Fabric PO #\s*([0-9 \/]+)/);
  let garment=find(/DESCRIPTION:\s*(.+?)\s+(?:BRAND|PACK|CONTENT|$)/);
  let color=find(/Exenta Color\s*-\s*Descr\s*(.+?)\s+(?:NRF|LABEL|CONTENT|$)/);
  if(color) color=color.replace(/\s+Color.*$/,"").trim();

  // size breakdown: aggregate every SIZES row with the QTY row beneath it
  const sizeBreakdown={};
  for(let i=0;i<allLines.length;i++){
    if(/^SIZES\b/.test(allLines[i])){
      const sizes=allLines[i].replace(/^SIZES/,"").replace(/TOTAL.*$/,"").trim().split(/\s+/).filter(Boolean);
      // the QTY row follows within a few lines
      let j=-1; for(let k=i+1;k<Math.min(i+5,allLines.length);k++){ if(/^QTY\b/.test(allLines[k])){ j=k; break; } }
      if(j>=0){
        const nums=allLines[j].replace(/^QTY/,"").trim().split(/\s+/).map(x=>Number(x.replace(/,/g,""))).filter(n=>!isNaN(n));
        // last number on the QTY row is that block's total → drop it when counts line up
        const qtys=(nums.length===sizes.length+1)?nums.slice(0,-1):nums;
        sizes.forEach((sz,k)=>{ if(qtys[k]!=null) sizeBreakdown[sz]=(sizeBreakdown[sz]||0)+qtys[k]; });
      }
    }
  }
  const sizes=Object.keys(sizeBreakdown).join(", ");

  // ----- order lines: one per STYLE# block, each with its OWN price & quantity -----
  // (some POs repeat the same style/colour at different prices — e.g. GOH vs Flat pack)
  const lines=[];
  for(let i=0;i<allLines.length;i++){
    const sm=allLines[i].match(/STYLE#\s*([A-Za-z0-9\-]+)/);
    if(!sm) continue;                              // only "STYLE#" blocks (BOM uses "STYLE:")
    const lstyle=sm[1];
    const pm=allLines[i].match(/([\d,]+\.\d{2,4})\s*USD/);   // price sits on the STYLE# line
    let lprice=pm?Number(pm[1].replace(/,/g,""))||0:0;
    let lqty=0,lcolor="",llabel="",lpack="",lsizes=null,lsb=null;
    for(let k=i+1;k<allLines.length;k++){
      if(/STYLE#/.test(allLines[k])) break;        // reached the next block
      if(!lprice){ const pm2=allLines[k].match(/([\d,]+\.\d{2,4})\s*USD/); if(pm2) lprice=Number(pm2[1].replace(/,/g,""))||0; }
      if(!lcolor){ const cm=allLines[k].match(/Exenta Color\s*-\s*Descr\s*(.+?)\s+(?:NRF|LABEL|CONTENT|$)/); if(cm) lcolor=cm[1].replace(/\s+Color.*$/,"").trim(); }
      if(!llabel){ const lm=allLines[k].match(/LABEL[ \t]+([A-Za-z0-9]+)/); if(lm) llabel=lm[1]; }
      if(!lpack){ const pkm=allLines[k].match(/PACK\s*:?\s*([A-Za-z0-9]+)/); if(pkm) lpack=pkm[1]; }
      if(/^SIZES\b/.test(allLines[k])){ lsizes=allLines[k].replace(/^SIZES/,"").replace(/TOTAL.*$/,"").trim().split(/\s+/).filter(Boolean); }
      if(/^QTY\b/.test(allLines[k])){
        const nums=allLines[k].replace(/^QTY/,"").trim().split(/\s+/).map(x=>Number(x.replace(/,/g,""))).filter(n=>!isNaN(n));
        if(nums.length){ const last=nums[nums.length-1], rest=nums.slice(0,-1).reduce((a,b)=>a+b,0);
          lqty=(nums.length>1 && Math.abs(last-rest)<0.5)?last:nums.reduce((a,b)=>a+b,0); }
        // this block's own size breakdown (colour part kept separate)
        if(lsizes && lsizes.length){
          const qtys=(nums.length===lsizes.length+1)?nums.slice(0,-1):nums;
          lsb={}; lsizes.forEach((sz,ix)=>{ if(qtys[ix]!=null) lsb[sz]=(lsb[sz]||0)+qtys[ix]; });
        }
        break;                                     // first QTY row after STYLE# is this block's
      }
    }
    lines.push({style:lstyle,color:lcolor,label:llabel,pack:lpack,price:lprice,qty:lqty,sizes:lsizes||[],sizeBreakdown:lsb||null});
  }
  // drop repeated STYLE# headers that carry no quantity (PO summary / UPC / BOM pages)
  const orderLines=lines.filter(l=>Number(l.qty||0)>0);
  // any line whose price didn't parse → fall back to the first price on the PO
  const firstPrice=(orderLines.find(l=>l.price>0)||{}).price||Number((find(/([\d,]+\.\d{2,4})\s*USD/)||"0").replace(/,/g,""))||0;
  orderLines.forEach(l=>{ if(!l.price) l.price=firstPrice; });

  const lineQtySum=orderLines.reduce((s,l)=>s+Number(l.qty||0),0);
  const quantity=headerQty||lineQtySum||0;
  const priceSet=[...new Set(orderLines.map(l=>l.price).filter(p=>p>0))];
  const unitPrice=priceSet.length===1?priceSet[0]:(firstPrice||0);
  const colorList=[...new Set(orderLines.map(l=>l.color).filter(Boolean))];
  if(colorList.length) color=colorList.join(", ");
  const styleList=[...new Set(orderLines.map(l=>l.style).filter(Boolean))];

  const noteBits=[];
  if(priceSet.length>1) noteBits.push(priceSet.length+" prices: "+priceSet.map(p=>"$"+p.toFixed(2)).join(" / ")+" — see price breakdown");
  if(styleList.length>1) noteBits.push(styleList.length+" styles on this PO ("+styleList.join(", ")+")");
  if(Math.abs(lineQtySum-headerQty)>0.5 && headerQty && lineQtySum) noteBits.push("qty check: lines total "+num(lineQtySum)+" vs header "+num(headerQty));
  if(division) noteBits.push("Division "+division);
  if(theme) noteBits.push("Theme "+theme);
  if(shipVia) noteBits.push("Ship via "+shipVia);
  if(fabricPo) noteBits.push("Fabric PO "+fabricPo.trim());
  if(body) noteBits.push("Body# "+body);

  return {
    poNumber, buyer, buyerCountry:"United States", vendor:"Active Plus Trading-FZCO",
    style, garment: garment? garment.replace(/\s+/g," ").replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()) : "",
    fabric:"", color, quantity, unitPrice, lines:orderLines, currency:"USD",
    orderDate:issue||today(), deliveryDate:etd||"", eta:eta||"",
    shipTerms:(shipTerms||"").trim(), shipVia, hts, retail:0,
    sizes, sizeBreakdown, notes:noteBits.join(" · "),
    materials:[]
  };
}
async function extractPOviaAI(base64){
  const prompt=`You are a data-extraction engine for a garment manufacturing ERP. Read the attached buyer purchase order PDF and return ONLY a JSON object (no markdown fences, no commentary) with EXACTLY these keys:
{"poNumber":string,"buyer":string,"buyerCountry":string,"vendor":string,"style":string,"garment":string,"fabric":string,"color":string,"quantity":number,"unitPrice":number,"lines":[{"style":string,"color":string,"label":string,"pack":string,"price":number,"qty":number}],"currency":string,"orderDate":"YYYY-MM-DD","deliveryDate":"YYYY-MM-DD","eta":"YYYY-MM-DD","shipTerms":string,"shipVia":string,"hts":string,"retail":number,"sizes":string,"sizeBreakdown":{"<size>":number},"notes":string,"materials":[{"material":string,"type":"Fabric|Thread|Trim|Packaging|Other","color":string,"supplier":string,"unit":string}]}
Rules: deliveryDate = the ETD (ship) date. buyer = the CUSTOMER/retailer the goods are made for. garment = the style description in Title Case. quantity = total order quantity. lines = ONE entry per STYLE# order block, each carrying that block's own DDP/FOB unit price and that block's total quantity (a PO may repeat the same style/colour at different prices, e.g. GOH vs Flat pack — keep them as separate lines). unitPrice = the price when all lines share one price, else the first line's price. Combine duplicate material rows. Use "" or 0 when a value is absent. Return only the JSON object.`;
  let resp;
  if(HAS_STORE){
    // Inside claude.ai — Claude's built-in AI service (no key needed)
    resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:1000,
        messages:[{role:"user",content:[
          {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}},
          {type:"text",text:prompt}
        ]}] })
    });
  } else {
    // Hosted elsewhere — call a secure proxy that keeps the API key server-side.
    // Supabase Edge Function URL set in firebase-config.js (window.AI_PROXY_URL),
    // else the Netlify function path for a Netlify deploy.
    const proxy = (typeof window!=="undefined" && window.AI_PROXY_URL) ? window.AI_PROXY_URL : "/.netlify/functions/extract-po";
    resp=await fetch(proxy,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ base64, prompt })
    });
  }
  if(!resp.ok){ throw new Error("AI reader unavailable (HTTP "+resp.status+"). Check the Supabase function URL/key, use Load sample, or enter the PO manually."); }
  const out=await resp.json();
  if(out.error){ throw new Error(typeof out.error==="string"?out.error:(out.error.message||"AI reader error")); }
  const text=(out.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const clean=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const start=clean.indexOf("{"), end=clean.lastIndexOf("}");
  if(start<0||end<0) throw new Error("Could not parse the order. Try again or enter it manually.");
  return JSON.parse(clean.slice(start,end+1));
}

function upsertSupplier(name){
  if(!name||/^factory source$/i.test(name)) name=name||"Factory Source";
  let s=DB.suppliers.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!s){ s={id:uid("sup"),name,country:"",material:"",contact:"",email:""}; DB.suppliers.push(s); }
  return s.id;
}
/* make sure every supplier used on an inventory item also exists in the Suppliers list */
function syncSuppliersFromInventory(){
  if(!DB.suppliers) DB.suppliers=[];
  const have=new Set(DB.suppliers.map(s=>(s.name||"").trim().toLowerCase()));
  let added=0;
  (DB.inventory||[]).forEach(it=>{
    const nm=(it.supplier||"").trim();
    if(nm && !have.has(nm.toLowerCase())){
      DB.suppliers.push({id:uid("sup"),name:nm,country:"",material:it.category||"",contact:"",email:"",fromInventory:true});
      have.add(nm.toLowerCase()); added++;
    }
  });
  return added;
}
async function commitImport(thenEdit){
  const d=PENDING; if(!d) return;
  const buyerId=upsertBuyer(d.buyer,{country:d.buyerCountry,terms:d.shipTerms});
  const pn=(d.poNumber||"").trim();
  const lines=Array.isArray(d.lines)&&d.lines.length?d.lines.map(l=>({style:l.style||"",color:l.color||"",label:l.label||"",pack:l.pack||"",price:Number(l.price||0),qty:Number(l.qty||0),sizes:Array.isArray(l.sizes)?l.sizes:[],sizeBreakdown:l.sizeBreakdown||null})):null;
  // a PO number must be unique — if it already exists, this is a REVISION: update it in place
  const existing = pn ? DB.pos.find(p=>(p.poNumber||"").trim().toLowerCase()===pn.toLowerCase()) : null;
  let poId;
  if(existing){
    poId=existing.id;
    Object.assign(existing,{
      buyerId, style:d.style||existing.style, garment:d.garment||existing.garment, fabric:d.fabric||existing.fabric,
      quantity:Number(d.quantity||0), unitPrice:Number(d.unitPrice||0), currency:d.currency||existing.currency||"USD",
      lines,
      deliveryDate:d.deliveryDate||existing.deliveryDate, eta:d.eta||existing.eta,
      colors:d.color||existing.colors, sizes:d.sizes||existing.sizes, sizeBreakdown:d.sizeBreakdown||existing.sizeBreakdown,
      shipTerms:d.shipTerms||existing.shipTerms, shipVia:d.shipVia||existing.shipVia, hts:d.hts||existing.hts,
      retail:Number(d.retail||existing.retail||0), vendor:d.vendor||existing.vendor, notes:d.notes||existing.notes,
      revisedAt:today(), revCount:Number(existing.revCount||0)+1
    });
    // production progress, status, id and existing BOM are kept as-is
    logAct("Revised PO (import)","Purchase Orders", pn+" · rev "+existing.revCount);
    await save(); closeModal(); PENDING=null;
    toast("PO "+pn+" updated as a revision — production progress kept","ok");
    openPO(poId); return;
  }
  poId=uid("po");
  DB.pos.push({
    id:poId, poNumber:pn||("PO-"+Date.now()), buyerId,
    style:d.style||"", garment:d.garment||"Garment", fabric:d.fabric||"",
    quantity:Number(d.quantity||0), unitPrice:Number(d.unitPrice||0), currency:d.currency||"USD",
    lines,
    orderDate:d.orderDate||today(), deliveryDate:d.deliveryDate||"", eta:d.eta||"",
    status:"Confirmed", colors:d.color||"", sizes:d.sizes||"", sizeBreakdown:d.sizeBreakdown||null,
    shipTerms:d.shipTerms||"", shipVia:d.shipVia||"", hts:d.hts||"", retail:Number(d.retail||0),
    vendor:d.vendor||"", notes:d.notes||"",
    production:{Cutting:0,Sewing:0,Finishing:0,"Quality Check":0,Packing:0}
  });
  (d.materials||[]).forEach(m=>{
    DB.bom.push({id:uid("bom"),poId,material:m.material||"Material",type:m.type||"Other",
      color:m.color||"",unit:m.unit||"pcs",qtyPerGarment:"",totalQty:"",supplierId:upsertSupplier(m.supplier),
      unitCost:"",status:"Required",eta:""});
  });
  logAct("Imported PO","Purchase Orders", (pn||"order")+" · "+(d.garment||""));
  await save(); closeModal(); PENDING=null;
  toast("Imported "+(pn||"order")+" — order, buyer and BOM created","ok");
  if(thenEdit) editPO(poId); else openPO(poId);
}

/* ---------- global drag-and-drop ---------- */
function setupDropzone(){
  let depth=0;
  window.addEventListener("dragenter",e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")){ depth++; $("#dropOverlay").classList.add("show"); } });
  window.addEventListener("dragover",e=>{ e.preventDefault(); });
  window.addEventListener("dragleave",e=>{ depth=Math.max(0,depth-1); if(depth===0) $("#dropOverlay").classList.remove("show"); });
  window.addEventListener("drop",e=>{
    e.preventDefault(); depth=0; $("#dropOverlay").classList.remove("show");
    if(!CURRENT) return;
    const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handlePOFile(f);
  });
}

function editUser(id){
  const r=id?DB.users.find(u=>u.id===id):{role:"user",active:true};
  const roleOpts=(DB.roles||[]).map(rl=>({value:rl.key,label:rl.label+(rl.admin?" (full access)":"")}));
  const fields=[
    {name:"name",label:"Full name",required:true,half:true},
    {name:"username",label:"Username",required:true,half:true,placeholder:"e.g. r.perera"},
    {name:"email",label:"Email",half:true},
    {name:"role",label:"Role",type:"select",options:roleOpts,half:true},
  ];
  if(!id) fields.push({name:"password",label:"Set password",type:"password",required:true,placeholder:"min 6 characters"});
  fields.push({name:"active",label:"Status",type:"select",options:[{value:"true",label:"Active"},{value:"false",label:"Inactive"}]});
  const rec = id?{...r,active:String(r.active)}:{...r,active:"true"};
  openModal({title:id?"Edit user":"New user", wide:true, record:rec, submitLabel:id?"Save user":"Create user", fields,
    onSubmit:async d=>{
      const uname=(d.username||"").trim();
      if(DB.users.some(u=>u.username.toLowerCase()===uname.toLowerCase() && u.id!==id)){ toast("That username is taken","warn"); return; }
      if(!id && (!d.password || d.password.length<6)){ toast("Password must be at least 6 characters","warn"); return; }
      // prevent removing the last active admin
      if(id){
        const wasAdmin=r.role==="admin"&&r.active;
        const willBeAdmin=d.role==="admin"&&d.active==="true";
        const otherAdmins=DB.users.filter(u=>u.id!==id&&u.role==="admin"&&u.active).length;
        if(wasAdmin&&!willBeAdmin&&otherAdmins===0){ toast("Keep at least one active administrator","warn"); return; }
      }
      if(id){
        r.name=d.name; r.username=uname; r.email=d.email; r.role=d.role; r.active=(d.active==="true"); delete r.isDefault;
        if(CURRENT&&CURRENT.id===id) CURRENT=r;
      } else {
        const salt=randSalt();
        // apply the role's default tab access (non-admin roles only); null/undefined = all tabs
        const rt=(DB.roleTabs||{})[d.role];
        const allowedTabs = roleIsAdmin(d.role) ? undefined : (Array.isArray(rt)? rt.slice() : undefined);
        DB.users.push({id:uid("usr"),name:d.name,username:uname,email:d.email||"",role:d.role,
          active:(d.active==="true"),salt,hash:await hashPassword(d.password,salt),

      await save(); closeModal(); VIEWS.users(); renderUserChrome(); toast(id?"User updated":"User created","ok");
    }});

function resetPass(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;

    fields:[{name:"password",label:"New password",type:"password",required:true,placeholder:"min 6 characters"}],

      logAct("Reset password","Users", "@"+u.username);
      await save(); closeModal(); toast("Password updated for @"+u.username,"ok");

async function toggleUser(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(u.active && u.role==="admin"){
    const others=DB.users.filter(x=>x.id!==id&&x.role==="admin"&&x.active).length;
    if(others===0){ toast("Keep at least one active administrator","warn"); return; }
  }
  if(CURRENT&&CURRENT.id===id && u.active){ toast("You can't disable your own account","warn"); return; }
  u.active=!u.active; logAct(u.active?"Enabled user":"Disabled user","Users", "@"+u.username);
  await save(); VIEWS.users(); toast(u.active?"User enabled":"User disabled","ok");

function delUser(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(CURRENT&&CURRENT.id===id){ toast("You can't delete your own account","warn"); return; }
  if(u.role==="admin"){
    const others=DB.users.filter(x=>x.id!==id&&x.role==="admin"&&x.active).length;
    if(others===0){ toast("Keep at least one active administrator","warn"); return; }
  }
  confirmModal("Delete user","@"+u.username+" will no longer be able to sign in.",async()=>{
    logAct("Deleted user","Users", "@"+u.username);
    DB.users=DB.users.filter(x=>x.id!==id); await save(); closeModal(); VIEWS.users(); toast("User deleted","ok");

  let rows=(DB.activity||[]).slice().sort((a,b)=>b.ts-a.ts);

  if(SUPER_TAB.to){ const t=new Date(SUPER_TAB.to+"T23:59:59").getTime(); rows=rows.filter(r=>r.ts<=t); }
  if(SUPER_TAB.q){ const q=SUPER_TAB.q.toLowerCase(); rows=rows.filter(r=>((r.user||"")+" "+(r.name||"")+" "+(r.action||"")+" "+(r.module||"")+" "+(r.detail||"")).toLowerCase().includes(q)); }

async function toggleSuperAdmin(id){
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  if(u.superadmin){
    const others=DB.users.filter(x=>x.id!==id&&x.superadmin).length;
    if(others===0){ toast("Keep at least one super administrator","warn"); return; }
    confirmModal("Remove super admin","Remove Super Admin access from @"+u.username+"?",async()=>{
      u.superadmin=false; logAct("Removed super admin","Super Admin","@"+u.username);
      await save(); closeModal(); if(CURRENT&&CURRENT.id===id){ buildNav(); go("dashboard"); } else VIEWS.superadmin(); toast("Super admin removed","ok");
    });
  } else {
    if(u.role!=="admin"){ toast("Only an administrator account can be made super","warn"); return; }
    u.superadmin=true; logAct("Granted super admin","Super Admin","@"+u.username);
    await save(); VIEWS.superadmin(); toast("@"+u.username+" is now a super admin","ok");
  }
}

function addRole(){
  openModal({title:"Add role", record:{}, submitLabel:"Add role",
    fields:[{name:"label",label:"Role name",required:true,placeholder:"e.g. Quality Controller"}],
    onSubmit:async d=>{
      const label=(d.label||"").trim(); if(!label){ toast("Enter a role name","warn"); return; }
      let key=label.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,20)||("role"+Date.now());
      if((DB.roles||[]).some(r=>r.key===key)) key=key+Date.now().toString().slice(-3);
      DB.roles.push({key,label,admin:false});
      logAct("Added role","Super Admin", label);
      await save(); closeModal(); VIEWS.superadmin(); toast("Role added","ok");
    }});
}
function renameRole(key){
  const rl=(DB.roles||[]).find(r=>r.key===key); if(!rl) return;
  openModal({title:"Rename role", record:{label:rl.label}, submitLabel:"Save",
    fields:[{name:"label",label:"Role name",required:true}],
    onSubmit:async d=>{ const label=(d.label||"").trim(); if(!label){ toast("Enter a name","warn"); return; }
      rl.label=label; logAct("Renamed role","Super Admin", key+" → "+label);
      await save(); closeModal(); VIEWS.superadmin(); toast("Role renamed","ok"); }});
}
function delRole(key){

  if(DB.users.some(u=>u.role===key)){ toast("Role is assigned to users — can't delete","warn"); return; }
  confirmModal("Delete role","Remove this role?",async()=>{
    DB.roles=DB.roles.filter(r=>r.key!==key); if(DB.roleTabs) delete DB.roleTabs[key];
    logAct("Deleted role","Super Admin", key);
    await save(); closeModal(); VIEWS.superadmin(); toast("Role deleted","ok");
  });
}
function roleTabsEdit(key){
  const rl=(DB.roles||[]).find(r=>r.key===key); if(!rl) return;
  const current=(DB.roleTabs||{})[key] || CONTROLLABLE_TABS.slice();
  const rows=CONTROLLABLE_TABS.map(t=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px">

  $("#taAll").onclick=()=>$$("#modal input[data-tab]").forEach(c=>c.checked=true);
  $("#taNone").onclick=()=>$$("#modal input[data-tab]").forEach(c=>c.checked=false);
  $("#taSave").onclick=async()=>{
    const sel=$$("#modal input[data-tab]").filter(c=>c.checked).map(c=>c.dataset.tab);
    if(!DB.roleTabs) DB.roleTabs={}; DB.roleTabs[key]=sel;

    await save(); closeModal(); VIEWS.superadmin(); toast("Default tabs saved for "+rl.label,"ok");
  };
}

/* ============================================================

let PENDING_LOGIN=null;      // user awaiting 2FA
let PENDING_2FA_SECRET=null; // secret being set up
const AUTH_BRAND=`<div class="lmark"><div class="stitch">S</div><div><h1>Seam</h1><div class="sub">Garment ERP</div></div></div>`;
function authErr(msg){ const e=$("#a_err"); if(e){ e.textContent=msg; e.classList.add("show"); } }
function fldHTML(id,label,type,ph,extra=""){ return `<label class="fld"><span class="lab">${label}</span><input id="${id}" type="${type}" ${extra} placeholder="${ph||""}"></label>`; }

function showLogin(){ renderAuth("login"); }
function renderAuth(view, ctx={}){

      <div class="loginerr" id="a_err"></div>

      <button class="btn primary" id="a_btn">Sign in</button>
      <span class="authlink" id="a_forgot">Forgot password?</span>`;

  }
  else if(view==="twofa"){
    box.innerHTML=`${AUTH_BRAND}<h2>Two-factor code</h2>
      <div class="lsub">Enter the 6-digit code from your authenticator app.</div>
      <div class="loginerr" id="a_err"></div>
      <label class="fld otpinput"><span class="lab">Authentication code</span><input id="a_code" inputmode="numeric" maxlength="6" placeholder="000000"></label>
      <button class="btn primary" id="a_btn">Verify</button>
      <span class="authlink" id="a_back">Back to sign in</span>
      <span class="authlink" id="a_lost">Lost your device? Recover account</span>`;
    $("#a_btn").onclick=submit2FA;
    $("#a_code").onkeydown=e=>{ if(e.key==="Enter") submit2FA(); };
    $("#a_back").onclick=()=>{ PENDING_LOGIN=null; renderAuth("login"); };
    $("#a_lost").onclick=()=>renderAuth("forgot");
    focusFirst();
  }
  else if(view==="forgot"){
    box.innerHTML=`${AUTH_BRAND}<h2>Recover account</h2>
      <div class="lsub">Enter your recovery code to set a new password. This also switches off two-factor authentication.</div>
      <div class="loginerr" id="a_err"></div>
      ${fldHTML("a_user","Username","text","username")}
      ${fldHTML("a_code","Recovery code","text","XXXX-XXXX-XXXX-XXXX")}
      ${fldHTML("a_pass","New password","password","min 6 characters")}

    $("#a_pass2").onkeydown=e=>{ if(e.key==="Enter") submitForgot(); };
    $("#a_back").onclick=()=>renderAuth("login");

function focusFirst(){ setTimeout(()=>{ const el=$("#authBox input"); if(el) el.focus(); },60); }

async function submitSetup(){
  const name=$("#a_name").value.trim(), user=$("#a_user").value.trim(), p1=$("#a_pass").value, p2=$("#a_pass2").value;
  if(!name||!user){ return authErr("Enter your name and a username."); }
  if(p1.length<6){ return authErr("Password must be at least 6 characters."); }
  if(p1!==p2){ return authErr("Passwords don't match."); }
  const code=await completeSetup(name,user,p1);
  renderAuth("recovery",{code, onContinue:enterApp});
}
async function submitLogin(){
  const username=$("#a_user").value.trim(), password=$("#a_pass").value;
  if(!username||!password){ return authErr("Enter your username and password."); }
  const u=DB.users.find(x=>x.username.toLowerCase()===username.toLowerCase());
  if(!u||!u.active){ return authErr("No active account with that username."); }
  const h=await hashPassword(password,u.salt);
  if(h!==u.hash){
    try{ DB.activity&&DB.activity.push({id:uid("act"),ts:Date.now(),user:u.username,name:u.name||u.username,role:u.role,action:"Failed sign-in",module:"Auth",detail:"wrong password"}); await storeSet(DB); }catch(e){}
    return authErr("Incorrect password. Try again.");
  }
  if(u.twoFA && u.totpSecret){ PENDING_LOGIN=u; renderAuth("twofa"); }
  else finalizeLogin(u);
}
async function submit2FA(){
  const code=$("#a_code").value; const u=PENDING_LOGIN;
  if(!u) return renderAuth("login");
  if(await verifyTOTP(u.totpSecret, code)){ PENDING_LOGIN=null; finalizeLogin(u); }
  else authErr("That code isn't valid. Check your app and try again.");
}
async function submitForgot(){
  const username=$("#a_user").value.trim(), code=$("#a_code").value.trim().toUpperCase(), p1=$("#a_pass").value, p2=$("#a_pass2").value;
  if(!username||!code){ return authErr("Enter your username and recovery code."); }
  const u=DB.users.find(x=>x.username.toLowerCase()===username.toLowerCase());
  if(!u||!u.recoveryHash){ return authErr("No recovery code on this account. Ask an administrator to reset your password."); }
  if(p1.length<6){ return authErr("New password must be at least 6 characters."); }
  if(p1!==p2){ return authErr("Passwords don't match."); }
  const rh=await hashPassword(code, u.recoverySalt);
  if(rh!==u.recoveryHash){ return authErr("That recovery code isn't correct."); }
  u.salt=randSalt(); u.hash=await hashPassword(p1,u.salt);
  u.twoFA=false; u.totpSecret="";
  const nc=generateRecoveryCode(); u.recoverySalt=randSalt(); u.recoveryHash=await hashPassword(nc,u.recoverySalt);
  await storeSet(DB);
  renderAuth("recovery",{code:nc, onContinue:()=>{ toast("Account recovered — sign in with your new password","ok"); renderAuth("login"); }});
}
async function finalizeLogin(u){ CURRENT=u; logAct("Signed in","Auth",""); await storeSet(DB); await sessionSet({userId:u.id}); enterApp(); }

async function doLogout(){
  logAct("Signed out","Auth",""); await storeSet(DB);
  await sessionSet(null); CURRENT=null; PENDING_LOGIN=null;
  $("#topActions").innerHTML=""; $("#view").innerHTML=""; $("#nav").innerHTML=""; $("#sideFoot").innerHTML="";
  renderAuth("login");
}
function renderUserChrome(){
  if(!CURRENT) return;
  $("#sideFoot").innerHTML=`
    <div class="userchip"><div class="avatar">${esc(initials(CURRENT.name||CURRENT.username))}</div>
      <div><div class="un">${esc(CURRENT.name||CURRENT.username)}</div>
      <div class="ur">${esc(roleLabel(CURRENT.role))}${CURRENT.superadmin?" · ★":""}${CURRENT.twoFA?" · 2FA on":""}</div></div></div>
    ${FB_ON?`<div style="font-size:11px;color:#7fd8b0;margin-bottom:8px">☁ Shared database — on</div>`:""}
    ${isAdmin()?`<button onclick="go('settings')" style="margin-bottom:8px">Settings</button>`:""}
    <button onclick="doLogout()">Sign out</button>`;
}
function enterApp(){
  $("#authScreen").classList.remove("show");
  renderUserChrome(); buildNav(); go(ROUTE);
  subscribeFirebase();
  if(!PERSIST_OK){

    }
  }
}

async function changeMyPassword(){
  const oldp=$("#cp_old").value, np=$("#cp_new").value, cf=$("#cp_c").value;

  if(np.length<6){ toast("New password must be at least 6 characters","warn"); return; }
  if(np!==cf){ toast("New passwords don't match","warn"); return; }
  CURRENT.salt=randSalt(); CURRENT.hash=await hashPassword(np,CURRENT.salt);
  await save(); toast("Password updated","ok"); VIEWS.account();
}
function regenRecovery(){
  confirmModal("Regenerate recovery code","Any previous recovery code stops working. You'll see the new one once.",async()=>{
    const code=generateRecoveryCode(); CURRENT.recoverySalt=randSalt(); CURRENT.recoveryHash=await hashPassword(code,CURRENT.recoverySalt);

function showRecoveryModal(code){

function enable2FA(){
  PENDING_2FA_SECRET=generateTOTPSecret();
  const uri=otpauthURI(CURRENT.username, PENDING_2FA_SECRET);
  const pretty=PENDING_2FA_SECRET.replace(/(.{4})/g,"$1 ").trim();
  $("#modal").className="modal wide";
  $("#modal").innerHTML=`<div class="modal-head"><h3>Set up two-factor authentication</h3><div class="x" id="mx">×</div></div>
    <div class="modal-body">
      <p class="muted" style="font-size:13px;margin:0 0 6px">1. Scan this QR code with Google Authenticator, Authy, or a similar app.</p>

      <p class="muted" style="font-size:12.5px;margin:4px 0 6px;text-align:center">Can't scan? Enter this key manually:</p>
      <div class="keyline">${esc(pretty)}</div>
      <p class="muted" style="font-size:13px;margin:16px 0 6px">2. Enter the 6-digit code the app shows to confirm.</p>
      <label class="fld otpinput"><input id="tf_code" inputmode="numeric" maxlength="6" placeholder="000000"></label>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mcancel">Cancel</button>
      <button class="btn primary" id="tf_verify">Verify & enable</button></div>`;
  $("#scrim").classList.add("open");
  $("#mx").onclick=closeModal; $("#mcancel").onclick=closeModal;
  $("#tf_verify").onclick=verifyEnable2FA;
  $("#tf_code").onkeydown=e=>{ if(e.key==="Enter") verifyEnable2FA(); };
  try{
    if(window.QRCode){ new QRCode(document.getElementById("qrTarget"),{text:uri,width:184,height:184,correctLevel:QRCode.CorrectLevel.M}); }
    else { $("#qrTarget").innerHTML=`<div class="muted" style="font-size:12px;padding:10px 20px">QR display unavailable offline — use the manual key below.</div>`; }
  }catch(e){ $("#qrTarget").innerHTML=`<div class="muted" style="font-size:12px;padding:10px 20px">QR display unavailable — use the manual key below.</div>`; }
  setTimeout(()=>{ const c=$("#tf_code"); if(c) c.focus(); },80);
}
async function verifyEnable2FA(){
  const code=$("#tf_code").value;
  if(!(window.crypto&&crypto.subtle)){ toast("This browser can't verify codes securely","warn"); return; }
  if(await verifyTOTP(PENDING_2FA_SECRET, code)){
    CURRENT.twoFA=true; CURRENT.totpSecret=PENDING_2FA_SECRET; PENDING_2FA_SECRET=null;
    await save(); closeModal(); renderUserChrome(); VIEWS.account(); toast("Two-factor authentication enabled","ok");
  } else { toast("That code isn't valid yet — try the current one","warn"); }
}
function disable2FA(){
  openModal({title:"Turn off two-factor", record:{}, submitLabel:"Turn off",
    fields:[{name:"pw",label:"Confirm your password",type:"password",required:true}],
    onSubmit:async d=>{
      const h=await hashPassword(d.pw, CURRENT.salt);
      if(h!==CURRENT.hash){ toast("Password is incorrect","warn"); return; }
      CURRENT.twoFA=false; CURRENT.totpSecret=""; await save(); closeModal(); renderUserChrome(); VIEWS.account(); toast("Two-factor turned off","ok");
    }});
}

/* ---------- reset (admin) ---------- */
function doReset(){
  if(!isAdmin()) return;
  confirmModal("Reset demo data","This restores the sample buyers, orders and shipments. User accounts are kept.",async()=>{
    const users=DB.users; DB=seed(); DB.users=users; await storeSet(DB);
    closeModal(); buildNav(); go("dashboard"); toast("Demo data reset","ok");
  });
}

/* boot */
setupDropzone();
(async function boot(){
  initFirebase();
  await initData();
  const s=await sessionGet();
  if(s&&s.userId){ const u=DB.users.find(x=>x.id===s.userId&&x.active); if(u) CURRENT=u; }
  if(CURRENT) enterApp();
  else if(needsSetup()) renderAuth("setup");
  else renderAuth("login");
})();
</script>
